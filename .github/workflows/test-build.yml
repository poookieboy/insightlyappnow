name: Build Insightly Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Insightly
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        shell: bash
        run: |
          set +e

          NODE_OPTIONS="--max-old-space-size=6144" npm run build
          BUILD_EXIT=$?

          echo "Build exited with code: $BUILD_EXIT"
          echo "Searching for web output..."

          if [ -f "dist/client/index.html" ]; then
            echo "Found dist/client/index.html"
            exit 0
          fi

          if [ -f "dist/index.html" ]; then
            echo "Found dist/index.html"
            exit 0
          fi

          echo "No usable web build found."
          find . -maxdepth 5 -type f -name "index.html" -print || true

          exit "$BUILD_EXIT"

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -e

          echo "Preparing Capacitor assets..."

          if [ -f "dist/client/index.html" ]; then
            echo "Using dist/client"
            rm -rf dist-capacitor
            mkdir -p dist-capacitor
            cp -R dist/client/. dist-capacitor/

          elif [ -f "dist/index.html" ]; then
            echo "Using dist"
            rm -rf dist-capacitor
            mkdir -p dist-capacitor
            cp -R dist/. dist-capacitor/

          else
            echo "ERROR: index.html not found."
            find . -maxdepth 5 -type f -name "index.html" -print
            exit 1
          fi

          rm -rf dist
          mv dist-capacitor dist

          test -f dist/index.html

          echo "Capacitor assets ready."

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK was not produced."
            exit 1
          fi

          echo "APK created: $APK"

      - name: Verify AAB
        shell: bash
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -type f -name "*.aab" | head -1)

          if [ -z "$AAB" ]; then
            echo "AAB was not produced."
            exit 1
          fi

          echo "AAB created: $AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
