name: Build Insightly Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Insightly Android
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECK OUT THE PROJECT
      # --------------------------------------------------
      - name: Checkout Insightly
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. SET UP NODE.JS
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # 3. SET UP JAVA
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 4. SET UP ANDROID SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. INSTALL NPM DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          set -e

          echo "Installing Insightly dependencies..."

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # --------------------------------------------------
      # 6. VERIFY CAPACITOR PACKAGES
      # --------------------------------------------------
      - name: Verify Capacitor installation
        run: |
          set -e

          echo "Checking Capacitor packages..."

          npm list @capacitor/core @capacitor/cli @capacitor/android --depth=0 || true

          echo ""
          echo "Capacitor CLI version:"
          npx cap --version

      # --------------------------------------------------
      # 7. CHECK CAPACITOR CONFIGURATION
      # --------------------------------------------------
      - name: Verify Capacitor configuration
        run: |
          set -e

          echo "Checking Capacitor configuration..."

          if [ -f capacitor.config.ts ]; then
            echo "Found capacitor.config.ts"
          elif [ -f capacitor.config.js ]; then
            echo "Found capacitor.config.js"
          elif [ -f capacitor.config.json ]; then
            echo "Found capacitor.config.json"
          else
            echo "ERROR: No Capacitor configuration file found."
            exit 1
          fi

      # --------------------------------------------------
      # 8. BUILD THE WEB APPLICATION
      # --------------------------------------------------
      - name: Build web application
        run: |
          set -e

          echo "Building Insightly web application..."

          npm run build

      # --------------------------------------------------
      # 9. FIND THE WEB BUILD DIRECTORY
      # --------------------------------------------------
      - name: Verify web build
        run: |
          set -e

          echo "Searching for web build output..."

          if [ -f "dist/index.html" ]; then
            echo "FOUND: dist/index.html"
            echo "WEB_DIR=dist" >> "$GITHUB_ENV"

          elif [ -f "build/index.html" ]; then
            echo "FOUND: build/index.html"
            echo "WEB_DIR=build" >> "$GITHUB_ENV"

          elif [ -f "www/index.html" ]; then
            echo "FOUND: www/index.html"
            echo "WEB_DIR=www" >> "$GITHUB_ENV"

          else
            echo ""
            echo "ERROR: No web asset directory containing index.html was found."
            echo ""
            echo "Directories in repository:"
            find . -maxdepth 3 -type f -name "index.html" -print
            echo ""
            echo "Top-level files:"
            find . -maxdepth 2 -type f | sort | head -200
            exit 1
          fi

          echo ""
          echo "Web directory selected: $WEB_DIR"
          echo ""

          test -f "$WEB_DIR/index.html"

      # --------------------------------------------------
      # 10. ENSURE CAPACITOR ANDROID PACKAGE EXISTS
      # --------------------------------------------------
      - name: Ensure Capacitor Android package
        run: |
          set -e

          echo "Checking @capacitor/android..."

          if npm list @capacitor/android --depth=0 >/dev/null 2>&1; then
            echo "@capacitor/android is installed."
          else
            echo "@capacitor/android is missing."
            echo "Installing a compatible Capacitor Android package..."

            CORE_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")

            echo "Detected Capacitor core version: $CORE_VERSION"

            npm install "@capacitor/android@$CORE_VERSION"
          fi

      # --------------------------------------------------
      # 11. REMOVE ONLY THE BROKEN GENERATED ANDROID
      # --------------------------------------------------
      - name: Prepare clean Capacitor Android project
        run: |
          set -e

          echo "Preparing Android project..."

          if [ -d "android" ]; then
            echo "Existing Android directory found."

            if [ ! -f "android/capacitor.settings.gradle" ] || \
               [ ! -f "android/settings.gradle" ] || \
               [ ! -f "android/app/build.gradle" ]; then

              echo "Android project is incomplete."
              echo "Removing incomplete generated Android project."

              rm -rf android
            else
              echo "Android project appears complete."
            fi
          fi

      # --------------------------------------------------
      # 12. GENERATE ANDROID PROJECT IF NECESSARY
      # --------------------------------------------------
      - name: Create Capacitor Android project
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Creating Android project from Capacitor..."

            npx cap add android
          else
            echo "Using existing complete Android project."
          fi

      # --------------------------------------------------
      # 13. VERIFY ANDROID PROJECT BEFORE SYNC
      # --------------------------------------------------
      - name: Verify Capacitor Android project
        run: |
          set -e

          echo "===== CAPACITOR ANDROID PROJECT ====="

          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Basic Android project files exist."

          echo ""
          echo "Android directory:"
          ls -la android

          echo ""
          echo "App directory:"
          ls -la android/app

      # --------------------------------------------------
      # 14. UPDATE CAPACITOR CONFIG WEB DIRECTORY
      # --------------------------------------------------
      - name: Verify Capacitor web directory
        run: |
          set -e

          echo "Capacitor web directory: $WEB_DIR"

          test -f "$WEB_DIR/index.html"

          echo "Web assets are ready."

      # --------------------------------------------------
      # 15. SYNC WEB APP INTO ANDROID
      # --------------------------------------------------
      - name: Sync Capacitor Android
        run: |
          set -e

          echo "Synchronizing Insightly with Android..."

          npx cap sync android

      # --------------------------------------------------
      # 16. VERIFY GENERATED CAPACITOR FILES
      # --------------------------------------------------
      - name: Verify generated Capacitor files
        run: |
          set -e

          echo "===== VERIFYING CAPACITOR FILES ====="

          echo ""
          echo "Android project:"
          ls -la android

          echo ""
          echo "Android assets:"
          ls -la android/app/src/main/assets || true

          echo ""

          if [ -f "android/capacitor.settings.gradle" ]; then
            echo "OK: capacitor.settings.gradle exists"
          else
            echo "ERROR: capacitor.settings.gradle is missing"
            exit 1
          fi

          if [ -f "android/app/src/main/assets/capacitor.config.json" ]; then
            echo "OK: capacitor.config.json exists"
          else
            echo "ERROR: capacitor.config.json is missing"
            exit 1
          fi

          if [ -f "android/app/src/main/assets/capacitor.plugins.json" ]; then
            echo "OK: capacitor.plugins.json exists"
          else
            echo "ERROR: capacitor.plugins.json is missing"
            exit 1
          fi

      # --------------------------------------------------
      # 17. VERIFY WEB ASSETS INSIDE ANDROID
      # --------------------------------------------------
      - name: Verify copied web assets
        run: |
          set -e

          echo "Checking Android web assets..."

          if [ -f "android/app/src/main/assets/public/index.html" ]; then
            echo "SUCCESS: Android contains index.html"
          else
            echo "ERROR: index.html was not copied into Android."
            echo ""
            echo "Contents of assets:"
            find android/app/src/main/assets -maxdepth 3 -type f -print || true
            exit 1
          fi

      # --------------------------------------------------
      # 18. MAKE GRADLE WRAPPER EXECUTABLE
      # --------------------------------------------------
      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      # --------------------------------------------------
      # 19. CHECK GRADLE CONFIGURATION
      # --------------------------------------------------
      - name: Check Android Gradle configuration
        working-directory: android
        run: |
          set -e

          echo "Checking Android Gradle configuration..."

          echo ""
          echo "settings.gradle:"
          sed -n '1,200p' settings.gradle

          echo ""
          echo "app/build.gradle:"
          sed -n '1,220p' app/build.gradle

      # --------------------------------------------------
      # 20. BUILD RELEASE ANDROID APP BUNDLE
      # --------------------------------------------------
      - name: Build Android App Bundle
        working-directory: android
        run: |
          set -o pipefail

          echo "Building Insightly release Android App Bundle..."

          chmod +x gradlew

          ./gradlew bundleRelease --stacktrace --info

      # --------------------------------------------------
      # 21. FIND GENERATED AAB
      # --------------------------------------------------
      - name: Find generated AAB
        run: |
          set -e

          echo "Searching for generated Android App Bundle..."

          find android/app/build/outputs -type f -name "*.aab" -print

          AAB_COUNT=$(find android/app/build/outputs -type f -name "*.aab" | wc -l)

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: No AAB was generated."
            exit 1
          fi

          echo "SUCCESS: Found $AAB_COUNT AAB file(s)."

      # --------------------------------------------------
      # 22. RENAME RELEASE AAB
      # --------------------------------------------------
      - name: Prepare AAB artifact
        run: |
          set -e

          mkdir -p artifacts

          AAB=$(find android/app/build/outputs -type f -name "*.aab" | head -1)

          echo "Using AAB:"
          echo "$AAB"

          cp "$AAB" "artifacts/insightly-release.aab"

          test -f "artifacts/insightly-release.aab"

          ls -lh artifacts/insightly-release.aab

      # --------------------------------------------------
      # 23. UPLOAD AAB
      # --------------------------------------------------
      - name: Upload Insightly AAB
        uses: actions/upload-artifact@v4
        with:
          name: insightly-release-aab
          path: artifacts/insightly-release.aab
          if-no-files-found: error
          retention-days: 30
