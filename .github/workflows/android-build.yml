name: Build Insightly Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Insightly
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare Capacitor configuration
        run: |
          if [ -f capacitor.config.ts ]; then
            mv capacitor.config.ts capacitor.config.ts.backup
          fi

      - name: Initialize Capacitor
        run: |
          npx cap init Insightly com.ezenuel.insightly --web-dir dist

      - name: Configure Insightly
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.ezenuel.insightly',
            appName: 'Insightly',
            webDir: 'dist',
            server: {
              url: 'https://insightlyappnow.lovable.app',
              cleartext: false
            }
          };

          export default config;
          EOF

      - name: Install Android platform
        run: |
          npx cap add android

      - name: Verify Capacitor Android project
        run: |
          echo "===== ANDROID PROJECT ====="
          ls -la android

          echo "===== CAPACITOR GRADLE FILE ====="
          if [ -f android/capacitor.settings.gradle ]; then
            echo "FOUND capacitor.settings.gradle"
          else
            echo "ERROR: capacitor.settings.gradle is missing"
            exit 1
          fi

      - name: Build Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Find AAB
        run: |
          echo "===== GENERATED AAB ====="
          find android/app/build/outputs -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: insightly-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
