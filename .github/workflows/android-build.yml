name: Build Insightly Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Insightly
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Build Insightly web app
        run: |
          NODE_OPTIONS="--max-old-space-size=6144" npm run build

      - name: Find web assets
        id: web-assets
        run: |
          echo "Searching for the built web app..."

          if [ -f "dist/index.html" ]; then
            WEB_DIR="dist"
          elif [ -f ".output/public/index.html" ]; then
            WEB_DIR=".output/public"
          elif [ -f ".output/index.html" ]; then
            WEB_DIR=".output"
          else
            WEB_DIR=$(find . \
              -path './node_modules' -prune -o \
              -path './android' -prune -o \
              -name 'index.html' -print \
              | head -1 \
              | xargs -r dirname)
          fi

          if [ -z "$WEB_DIR" ] || [ ! -f "$WEB_DIR/index.html" ]; then
            echo "ERROR: Could not find built index.html"
            echo "Searching repository for index.html:"
            find . \
              -path './node_modules' -prune -o \
              -path './android' -prune -o \
              -name 'index.html' -print
            exit 1
          fi

          echo "Web assets found in: $WEB_DIR"
          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "Contents:"
          ls -la "$WEB_DIR"

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<EOF
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.ezenuel.insightly',
            appName: 'Insightly',
            webDir: '${WEB_DIR}',
            bundledWebRuntime: false
          };

          export default config;
          EOF

          echo "Capacitor configuration:"
          cat capacitor.config.ts

      - name: Create Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: insightly-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
