name: Build Insightly Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Insightly
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor packages
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.ezenuel.insightly',
            appName: 'Insightly',
            webDir: 'dist',
            server: {
              url: 'https://insightlyappnow.lovable.app',
              cleartext: false
            }
          };

          export default config;
          EOF

          echo "===== CAPACITOR CONFIG ====="
          cat capacitor.config.ts

      - name: Initialize Capacitor
        run: |
          npx cap init Insightly com.ezenuel.insightly --web-dir dist

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify Android Capacitor files
        run: |
          echo "===== ANDROID FILES ====="
          ls -la android

          echo "===== CAPACITOR FILES ====="
          find android -maxdepth 2 -type f \
            \( -name "*capacitor*" -o -name "settings.gradle*" \) \
            -print

          echo "===== SETTINGS.GRADLE ====="
          cat android/settings.gradle

      - name: Build Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: insightly-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
