name: Build Insightly Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Insightly
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Build Insightly web app
        run: NODE_OPTIONS="--max-old-space-size=6144" npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.ezenuel.insightly',
            appName: 'Insightly',
            webDir: 'dist',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: insightly-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
