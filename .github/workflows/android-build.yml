name: Build Insightly Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Insightly
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.ezenuel.insightly',
            appName: 'Insightly',
            webDir: 'dist',
            server: {
              url: 'https://insightlyappnow.lovable.app',
              cleartext: false
            }
          };

          export default config;
          EOF

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Prepare Capacitor Android configuration
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/assets/public

          cat > android/app/src/main/assets/capacitor.config.json <<'EOF'
          {
            "appId": "com.ezenuel.insightly",
            "appName": "Insightly",
            "webDir": "dist",
            "server": {
              "url": "https://insightlyappnow.lovable.app",
              "cleartext": false
            }
          }
          EOF

          cat > android/app/src/main/assets/capacitor.plugins.json <<'EOF'
          {
            "plugins": {}
          }
          EOF

      - name: Verify Android project
        run: |
          echo "===== ANDROID PROJECT ====="
          ls -la android

          echo "===== ASSETS ====="
          ls -la android/app/src/main/assets

          echo "===== CAPACITOR CONFIG ====="
          cat android/app/src/main/assets/capacitor.config.json

      - name: Build Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Find generated AAB
        run: |
          echo "===== AAB FILES ====="
          find android/app/build/outputs -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: insightly-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
