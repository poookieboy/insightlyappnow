name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android AAB + APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. NODE
      # ============================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      #
      # npm ci requires package.json and package-lock.json to match.
      # The lockfile must therefore already be synchronized in Git.
      # ============================================================
      - name: Install dependencies
        run: npm ci

      # ============================================================
      # 4. BUILD WEB APP
      # ============================================================
      - name: Build web app
        run: npm run build

      # ============================================================
      # 5. DIAGNOSE TANSTACK OUTPUT
      # ============================================================
      - name: Inspect web build output
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "WEB BUILD DIAGNOSTICS"
          echo "========================================"

          echo ""
          echo "Top-level directories:"
          find . -maxdepth 2 -type d \
            ! -path "./node_modules*" \
            ! -path "./android*" \
            -print | sort

          echo ""
          echo "Generated HTML files:"
          find . \
            -type f \
            -name "*.html" \
            ! -path "./node_modules/*" \
            ! -path "./android/*" \
            -print | sort || true

          echo ""
          echo "Generated .output files:"
          if [ -d ".output" ]; then
            find .output -maxdepth 8 -type f -print | sort || true
          else
            echo ".output does not exist"
          fi

      # ============================================================
      # 6. PREPARE CAPACITOR WEB ASSETS
      #
      # Capacitor is configured with:
      #
      #     webDir: dist
      #
      # TanStack Start may generate:
      #
      #     .output/public/index.html
      #
      # OR:
      #
      #     .output/public/_shell.html
      #
      # The latter is the important case that caused the previous
      # "NO WEB BUILD FOUND" failure.
      # ============================================================
      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING CAPACITOR WEB ASSETS"
          echo "========================================"

          rm -rf dist
          mkdir -p dist

          # --------------------------------------------------------
          # CASE 1:
          # Normal TanStack/Vite output
          # --------------------------------------------------------
          if [ -f ".output/public/index.html" ]; then

            echo "Found:"
            echo "  .output/public/index.html"

            cp -a .output/public/. dist/

          # --------------------------------------------------------
          # CASE 2:
          # TanStack Start SPA shell
          # --------------------------------------------------------
          elif [ -f ".output/public/_shell.html" ]; then

            echo "Found:"
            echo "  .output/public/_shell.html"

            echo "Using TanStack SPA shell as Capacitor index.html."

            cp -a .output/public/. dist/

            cp \
              ".output/public/_shell.html" \
              "dist/index.html"

          # --------------------------------------------------------
          # CASE 3:
          # Standard Vite build directory
          # --------------------------------------------------------
          elif [ -f "build/index.html" ]; then

            echo "Found:"
            echo "  build/index.html"

            cp -a build/. dist/

          # --------------------------------------------------------
          # CASE 4:
          # Public directory
          # --------------------------------------------------------
          elif [ -f "public/index.html" ]; then

            echo "Found:"
            echo "  public/index.html"

            cp -a public/. dist/

          # --------------------------------------------------------
          # CASE 5:
          # Search for any generated HTML
          # --------------------------------------------------------
          else

            echo "No standard entry point found."
            echo "Searching for generated HTML..."

            HTML_FILE="$(
              find .output/public .output build public \
                -type f \
                -name "*.html" \
                2>/dev/null \
                | sort \
                | head -1 || true
            )"

            if [ -n "$HTML_FILE" ] && [ -f "$HTML_FILE" ]; then

              echo "Found fallback HTML:"
              echo "  $HTML_FILE"

              SOURCE_DIR="$(dirname "$HTML_FILE")"

              cp -a "$SOURCE_DIR"/. dist/

              cp "$HTML_FILE" dist/index.html

            else

              echo ""
              echo "========================================"
              echo "ERROR: NO WEB ENTRY POINT FOUND"
              echo "========================================"

              echo ""
              echo "Expected one of:"
              echo "  .output/public/index.html"
              echo "  .output/public/_shell.html"
              echo "  build/index.html"
              echo "  public/index.html"

              echo ""
              echo "Full .output tree:"

              if [ -d ".output" ]; then
                find .output -maxdepth 10 -type f -print | sort
              else
                echo ".output does not exist."
              fi

              exit 1
            fi
          fi

          # ========================================================
          # FINAL VALIDATION
          # ========================================================

          echo ""
          echo "========================================"
          echo "FINAL CAPACITOR WEB ASSETS"
          echo "========================================"

          if [ ! -f "dist/index.html" ]; then
            echo ""
            echo "ERROR:"
            echo "dist/index.html was NOT created."
            echo ""

            echo "Contents of dist:"
            find dist -maxdepth 6 -type f -print | sort || true

            exit 1
          fi

          echo ""
          echo "SUCCESS!"
          echo "dist/index.html exists."
          echo "Size:"
          wc -c dist/index.html

          echo ""
          echo "Dist contents:"
          find dist -maxdepth 5 -type f -print | sort | head -300

      # ============================================================
      # 7. VERIFY CAPACITOR CONFIG
      # ============================================================
      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CAPACITOR CONFIGURATION"
          echo "========================================"

          if [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor.config.json not found."
            exit 1
          fi

          cat capacitor.config.json

          echo ""

          if ! grep -q '"webDir"[[:space:]]*:[[:space:]]*"dist"' capacitor.config.json; then
            echo "WARNING: capacitor.config.json does not appear to use webDir=dist."
          else
            echo "Confirmed: webDir=dist"
          fi

      # ============================================================
      # 8. JAVA 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ============================================================
      # 9. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 10. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          if [ ! -d "android" ]; then
            echo "ERROR: android/ directory does not exist."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist."
            exit 1
          fi

          chmod +x android/gradlew

          echo ""
          echo "Gradle wrapper:"
          ls -lh android/gradlew

          echo ""
          echo "Android build files:"
          find android -maxdepth 5 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \
            -o -name "AndroidManifest.xml" \) \
            -print | sort

      # ============================================================
      # 11. VERIFY SDK 36
      # ============================================================
      - name: Verify Android SDK versions
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK VERSION CHECK"
          echo "========================================"

          echo ""
          echo "Searching for compileSdk / targetSdk..."

          grep -RniE \
            "compileSdk|targetSdk|minSdk" \
            android/app \
            android/build.gradle \
            android/build.gradle.kts \
            2>/dev/null || true

          echo ""
          echo "Expected:"
          echo "  compileSdk = 36"
          echo "  targetSdk  = 36"

      # ============================================================
      # 12. CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ============================================================
      # 13. VERIFY CAPACITOR COPIED WEB ASSETS
      # ============================================================
      - name: Verify Capacitor Android web assets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING CAPACITOR WEB ASSETS"
          echo "========================================"

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html missing."
            exit 1
          fi

          echo "dist/index.html exists."

          echo ""
          echo "Android assets:"
          find android/app/src/main/assets \
            -maxdepth 5 \
            -type f \
            -print \
            2>/dev/null \
            | sort \
            | head -200 || true

      # ============================================================
      # 14. CHECK SIGNING SECRETS
      # ============================================================
      - name: Check signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHECKING ANDROID SIGNING SECRETS"
          echo "========================================"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "All required signing secrets are present."

      # ============================================================
      # 15. DECODE KEYSTORE
      # ============================================================
      - name: Decode Android keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DECODING KEYSTORE"
          echo "========================================"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/insightly-release.jks"

          if [ ! -s "$RUNNER_TEMP/insightly-release.jks" ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore created successfully."

      # ============================================================
      # 16. BUILD SIGNED AAB + APK
      # ============================================================
      - name: Build signed AAB and APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING INSIGHTLY ANDROID RELEASE"
          echo "========================================"

          chmod +x ./gradlew

          echo ""
          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "Cleaning previous builds..."
          ./gradlew clean --no-daemon

          echo ""
          echo "Building signed AAB..."
          ./gradlew bundleRelease \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/insightly-release.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD" \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Building signed APK..."
          ./gradlew assembleRelease \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/insightly-release.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD" \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 17. LOCATE OUTPUTS
      # ============================================================
      - name: Verify release outputs
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING RELEASE OUTPUTS"
          echo "========================================"

          echo ""
          echo "All AAB files:"
          find android/app/build/outputs \
            -type f \
            -name "*.aab" \
            -print \
            2>/dev/null || true

          echo ""
          echo "All APK files:"
          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          echo ""

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: Release AAB was not created."
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"

          echo ""
          echo "AAB:"
          ls -lh "$AAB_PATH"

          echo ""
          echo "APK:"
          ls -lh "$APK_PATH"

      # ============================================================
      # 18. UPLOAD AAB
      # ============================================================
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 19. UPLOAD APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
