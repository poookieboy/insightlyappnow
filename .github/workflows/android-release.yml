name: Android Release (AAB + APK)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
      versionCode:
        description: "Version code (integer)"
        required: false
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing Capacitor web assets"
          echo "========================================"

          # Use an existing valid dist build if one exists.
          if [ -f "dist/index.html" ]; then
            echo "Found dist/index.html"
          # Otherwise copy the TanStack Start static output.
          elif [ -f ".output/public/index.html" ]; then
            echo "Found .output/public/index.html"
            echo "Copying .output/public -> dist"

            rm -rf dist
            mkdir -p dist
            cp -a .output/public/. dist/
          else
            echo ""
            echo "ERROR: No Capacitor-compatible index.html was found."
            echo ""
            echo "Expected one of:"
            echo "  dist/index.html"
            echo "  .output/public/index.html"
            echo ""

            echo "===== .output contents ====="
            if [ -d ".output" ]; then
              find .output -maxdepth 6 -type f -print | sort
            else
              echo ".output does not exist"
            fi

            echo ""
            echo "===== dist contents ====="
            if [ -d "dist" ]; then
              find dist -maxdepth 6 -type f -print | sort
            else
              echo "dist does not exist"
            fi

            exit 1
          fi

          echo ""
          echo "===== Final dist contents ====="
          find dist -maxdepth 4 -type f -print | sort | head -200

      - name: Verify Capacitor web assets
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html does not exist."
            exit 1
          fi

          echo "SUCCESS: dist/index.html exists."
          ls -lh dist/index.html

      - name: Ensure Capacitor Android project and sync
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            echo "Android project does not exist."
            echo "Adding Capacitor Android platform..."
            npx cap add android
          else
            echo "Android project already exists."
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html is missing before Capacitor sync."
            exit 1
          fi

          echo "Syncing Capacitor Android..."
          npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle wrapper is executable
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Apply version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="${{ github.event.inputs.versionName }}"
          VERSION_CODE="${{ github.event.inputs.versionCode }}"

          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Decode keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/insightly.jks"

          if [ ! -s "$RUNNER_TEMP/insightly.jks" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Keystore decoded successfully."

      - name: Build signed AAB and APK
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew clean bundleRelease assembleRelease \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/insightly.jks" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

      - name: Verify AAB and APK
        shell: bash
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APK="android/app/build/outputs/apk/release/app-release.apk"

          echo "========================================"
          echo "Checking release files"
          echo "========================================"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not created."
            find android/app/build/outputs -type f -name "*.aab" -print || true
            exit 1
          fi

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find android/app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          echo ""
          echo "AAB:"
          ls -lh "$AAB"

          echo ""
          echo "APK:"
          ls -lh "$APK"

      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-Android-Release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
