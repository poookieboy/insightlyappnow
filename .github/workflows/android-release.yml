name: Android Release (AAB + APK)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

      versionCode:
        description: "Version code (integer)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE.JS
      # =========================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"


      # =========================================================
      # 3. VERIFY NODE
      # =========================================================

      - name: Verify Node.js configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Node.js configuration"
          echo "========================================"

          node --version
          npm --version

          echo ""
          echo "NODE_OPTIONS:"
          echo "$NODE_OPTIONS"

          echo ""
          echo "Node heap limit:"
          node -e "console.log(require('v8').getHeapStatistics().heap_size_limit / 1024 / 1024 + ' MB')"


      # =========================================================
      # 4. INSTALL DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Installing dependencies"
          echo "========================================"

          rm -rf node_modules

          npm install --no-audit --no-fund

          echo ""
          echo "Dependencies installed successfully."


      # =========================================================
      # 5. BUILD WEB APPLICATION
      # =========================================================

      - name: Build web assets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building Insightly web application"
          echo "========================================"

          npm run build

          echo ""
          echo "========================================"
          echo "WEB BUILD COMPLETED"
          echo "========================================"


      # =========================================================
      # 6. DIAGNOSE WEB BUILD OUTPUT
      # =========================================================

      - name: Diagnose web build output
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Diagnosing web build output"
          echo "========================================"

          echo ""
          echo "Root directories:"
          find . \
            -maxdepth 2 \
            -type d \
            ! -path "./node_modules*" \
            ! -path "./.git*" \
            | sort

          echo ""
          echo "HTML files:"
          find . \
            -type f \
            \( -name "*.html" -o -name "*.htm" \) \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            -print | sort || true

          echo ""
          echo ".output files:"

          if [ -d ".output" ]; then
            find .output \
              -maxdepth 10 \
              -type f \
              -print | sort
          else
            echo ".output does not exist."
          fi


      # =========================================================
      # 7. PREPARE CAPACITOR WEB ASSETS
      # =========================================================

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing Capacitor web assets"
          echo "========================================"

          rm -rf dist
          mkdir -p dist

          # -----------------------------------------------------
          # CASE 1: dist/index.html already exists
          # -----------------------------------------------------

          if [ -f "dist/index.html" ]; then

            echo "Found dist/index.html"
            echo "Using existing Capacitor web assets."

          # -----------------------------------------------------
          # CASE 2: .output/public/index.html
          # -----------------------------------------------------

          elif [ -f ".output/public/index.html" ]; then

            echo "Found .output/public/index.html"
            echo "Copying .output/public -> dist"

            cp -a .output/public/. dist/

          # -----------------------------------------------------
          # CASE 3: TanStack SPA shell
          # -----------------------------------------------------

          elif [ -f ".output/public/_shell.html" ]; then

            echo "Found .output/public/_shell.html"
            echo "Converting TanStack SPA shell to index.html"

            cp -a .output/public/. dist/

            cp \
              ".output/public/_shell.html" \
              "dist/index.html"

          # -----------------------------------------------------
          # CASE 4: build/index.html
          # -----------------------------------------------------

          elif [ -f "build/index.html" ]; then

            echo "Found build/index.html"
            echo "Copying build -> dist"

            cp -a build/. dist/

          # -----------------------------------------------------
          # CASE 5: public/index.html
          # -----------------------------------------------------

          elif [ -f "public/index.html" ]; then

            echo "Found public/index.html"
            echo "Copying public -> dist"

            cp -a public/. dist/

          # -----------------------------------------------------
          # CASE 6: Search generated output for ANY HTML
          # -----------------------------------------------------

          else

            echo ""
            echo "========================================"
            echo "NO STANDARD INDEX FOUND"
            echo "Searching generated output..."
            echo "========================================"

            HTML_FILE="$(
              find .output/public \
                -type f \
                \( -name "*.html" -o -name "*.htm" \) \
                -print \
                2>/dev/null \
                | head -n 1 || true
            )"

            if [ -n "$HTML_FILE" ]; then

              echo ""
              echo "Found generated HTML:"
              echo "$HTML_FILE"

              echo ""
              echo "Copying .output/public -> dist"

              cp -a .output/public/. dist/

              echo ""
              echo "Creating dist/index.html"

              cp "$HTML_FILE" "dist/index.html"

            else

              echo ""
              echo "========================================"
              echo "ERROR: NO WEB BUILD FOUND"
              echo "========================================"

              echo ""
              echo "Expected one of:"
              echo "  dist/index.html"
              echo "  .output/public/index.html"
              echo "  .output/public/_shell.html"
              echo "  build/index.html"
              echo "  public/index.html"

              echo ""
              echo "Searching entire repository for HTML..."

              find . \
                -type f \
                \( -name "*.html" -o -name "*.htm" \) \
                ! -path "./node_modules/*" \
                ! -path "./.git/*" \
                -print | sort || true

              echo ""
              echo "Full .output contents:"

              if [ -d ".output" ]; then
                find .output \
                  -maxdepth 10 \
                  -type f \
                  -print | sort
              else
                echo ".output does not exist."
              fi

              exit 1

            fi

          fi


          # =====================================================
          # FINAL CHECK
          # =====================================================

          echo ""
          echo "========================================"
          echo "Final Capacitor web asset check"
          echo "========================================"

          if [ ! -f "dist/index.html" ]; then

            echo ""
            echo "ERROR: dist/index.html was not created."
            exit 1

          fi

          echo ""
          echo "SUCCESS: dist/index.html exists."

          echo ""
          echo "File:"
          ls -lh dist/index.html

          echo ""
          echo "dist contents:"
          find dist \
            -maxdepth 5 \
            -type f \
            -print | sort

          echo ""
          echo "========================================"
          echo "CAPACITOR WEB ASSETS READY"
          echo "========================================"


      # =========================================================
      # 8. VERIFY CAPACITOR WEB ASSETS
      # =========================================================

      - name: Verify Capacitor web assets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verifying Capacitor web assets"
          echo "========================================"

          if [ ! -f "dist/index.html" ]; then
            echo ""
            echo "ERROR: dist/index.html does not exist."
            exit 1
          fi

          echo ""
          echo "SUCCESS:"
          echo "dist/index.html exists."

          echo ""
          echo "Size:"
          ls -lh dist/index.html


      # =========================================================
      # 9. JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 10. ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 11. ENSURE CAPACITOR ANDROID PROJECT
      # =========================================================

      - name: Ensure Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Ensuring Capacitor Android project"
          echo "========================================"

          if [ ! -d "android" ]; then

            echo "Android project does not exist."
            echo "Adding Capacitor Android..."

            npx cap add android

          else

            echo "Android project already exists."

          fi


      # =========================================================
      # 12. CAPACITOR SYNC
      # =========================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Syncing Capacitor Android"
          echo "========================================"

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html is missing."
            exit 1
          fi

          npx cap sync android

          echo ""
          echo "========================================"
          echo "CAPACITOR SYNC COMPLETED"
          echo "========================================"


      # =========================================================
      # 13. VERIFY ANDROID PROJECT
      # =========================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verifying Android project"
          echo "========================================"

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERROR: android/app/build.gradle does not exist."
            exit 1
          fi

          chmod +x android/gradlew

          echo ""
          echo "Gradle version:"

          android/gradlew --version

          echo ""
          echo "Android project verified."


      # =========================================================
      # 14. VERIFY ANDROID SDK 36
      # =========================================================

      - name: Verify Android SDK 36 configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking Android SDK configuration"
          echo "========================================"

          echo ""
          echo "compileSdk / targetSdk / minSdk:"

          grep -RniE \
            "compileSdk|targetSdk|minSdk" \
            android/app/build.gradle \
            android/build.gradle \
            android/gradle.properties \
            2>/dev/null || true

          echo ""
          echo "SDK configuration check complete."


      # =========================================================
      # 15. APPLY ANDROID VERSION
      # =========================================================

      - name: Apply Android version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="${{ github.event.inputs.versionName }}"
          VERSION_CODE="${{ github.event.inputs.versionCode }}"

          echo "========================================"
          echo "Applying Android version"
          echo "========================================"

          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: versionCode must be an integer."
            exit 1
          fi

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: versionName cannot be empty."
            exit 1
          fi

          if ! grep -q "versionCode" android/app/build.gradle; then
            echo "ERROR: versionCode not found."
            exit 1
          fi

          if ! grep -q "versionName" android/app/build.gradle; then
            echo "ERROR: versionName not found."
            exit 1
          fi

          sed -i \
            "s/versionCode .*/versionCode $VERSION_CODE/" \
            android/app/build.gradle

          sed -i \
            "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" \
            android/app/build.gradle

          echo ""
          echo "Updated version:"

          grep -nE \
            "versionCode|versionName" \
            android/app/build.gradle || true


      # =========================================================
      # 16. DECODE RELEASE KEYSTORE
      # =========================================================

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Decoding release keystore"
          echo "========================================"

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' \
            "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/insightly.jks"

          if [ ! -s "$RUNNER_TEMP/insightly.jks" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo ""
          echo "Keystore decoded successfully."


      # =========================================================
      # 17. VERIFY SIGNING SECRETS
      # =========================================================

      - name: Verify signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking signing configuration"
          echo "========================================"

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi

          echo ""
          echo "All required signing secrets are present."


      # =========================================================
      # 18. BUILD SIGNED AAB + APK
      # =========================================================

      - name: Build signed AAB and APK
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building signed AAB and APK"
          echo "========================================"

          chmod +x ./gradlew

          echo ""
          echo "Gradle version:"

          ./gradlew --version

          echo ""
          echo "Starting release build..."

          ./gradlew clean bundleRelease assembleRelease \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/insightly.jks" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD" \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "GRADLE BUILD COMPLETED"
          echo "========================================"


      # =========================================================
      # 19. LOCATE RELEASE FILES
      # =========================================================

      - name: Locate Android release files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Locating Android release files"
          echo "========================================"

          echo ""
          echo "AAB files:"

          find android/app/build/outputs \
            -type f \
            -name "*.aab" \
            -print || true

          echo ""
        
