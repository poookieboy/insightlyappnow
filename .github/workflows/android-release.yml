name: Insightly Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Prepare dist for Capacitor
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          if [ -f ".output/public/index.html" ]; then
            echo "Using .output/public"
            cp -a .output/public/. dist/

          elif [ -f ".output/public/_shell.html" ]; then
            echo "Using TanStack shell"
            cp -a .output/public/. dist/
            cp .output/public/_shell.html dist/index.html

          elif [ -f "dist/index.html" ]; then
            echo "Using existing dist"

          elif [ -f "build/index.html" ]; then
            echo "Using build/"
            cp -a build/. dist/

          else
            echo "Searching for generated HTML..."

            HTML_FILE=$(find . \
              -path "./node_modules" -prune -o \
              -path "./android" -prune -o \
              -type f -name "*.html" -print \
              | sort \
              | head -1 || true)

            if [ -z "$HTML_FILE" ]; then
              echo "ERROR: No HTML entry point was produced."
              exit 1
            fi

            echo "Using: $HTML_FILE"

            SOURCE_DIR=$(dirname "$HTML_FILE")
            cp -a "$SOURCE_DIR"/. dist/
            cp "$HTML_FILE" dist/index.html
          fi

          test -f dist/index.html

          echo "Capacitor web assets:"
          ls -lah dist
          echo "index.html:"
          ls -lh dist/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android project
        run: |
          test -d android
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/settings.gradle
          test -f android/app/src/main/assets/capacitor.config.json || true

          chmod +x android/gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/insightly-release.jks"

          test -s "$RUNNER_TEMP/insightly-release.jks"

      - name: Build signed AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew

          ./gradlew bundleRelease \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/insightly-release.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD" \
            --no-daemon \
            --stacktrace

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/insightly-release.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD" \
            --no-daemon \
            --stacktrace

      - name: Verify APK and AAB
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -f "$APK"
          test -f "$AAB"

          echo "APK:"
          ls -lh "$APK"

          echo "AAB:"
          ls -lh "$AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
