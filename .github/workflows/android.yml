name: Insightly Android Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Insightly Android APK and AAB
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund


      # ==========================================
      # BUILD WEB APP
      # ==========================================

      - name: Build web application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING INSIGHTLY WEB APPLICATION"
          echo "=========================================="

          npm run build

          echo ""
          echo "=========================================="
          echo "CHECKING WEB OUTPUT"
          echo "=========================================="

          if [ -f "dist/server/server.js" ] && [ -f "dist/client/index.html" ]; then
            echo "SUCCESS: Full build output detected (server + client)."
            echo "Using complete dist/ directory as-is for prerendering..."

          elif [ -f "dist/client/index.html" ]; then
            echo "SUCCESS: dist/client/index.html exists."
            echo "Preparing dist/client as the Capacitor web root..."

            rm -rf dist-capacitor
            mkdir -p dist-capacitor

            cp -R dist/client/. dist-capacitor/

            rm -rf dist
            mv dist-capacitor dist

          elif [ -f "dist/index.html" ]; then
            echo "SUCCESS: dist/index.html already exists."

          elif [ -f ".output/public/index.html" ]; then
            echo "SUCCESS: .output/public/index.html exists."

            rm -rf dist
            mkdir -p dist

            cp -R .output/public/. dist/

          else
            echo ""
            echo "ERROR: No usable web build was produced."
            echo ""
            echo "Searching for index.html files..."

            find . \
              -maxdepth 7 \
              -type f \
              -name "index.html" \
              -print

            echo ""
            echo "Searching build directories..."

            if [ -d "dist" ]; then
              find dist -maxdepth 4 -type f | head -100
            fi

            if [ -d ".output" ]; then
              find .output -maxdepth 5 -type f | head -150
            fi

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "VERIFYING DIST"
          echo "=========================================="

          test -f dist/index.html

          echo "SUCCESS: dist/index.html exists."
          echo ""

          ls -lah dist


      # ==========================================
      # CAPACITOR CONFIG
      # ==========================================

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CAPACITOR CONFIGURATION"
          echo "=========================================="

          test -f capacitor.config.json

          cat capacitor.config.json

          echo ""
          echo "Checking application ID..."

          grep -q '"com.insightly.app"' capacitor.config.json

          echo "SUCCESS: com.insightly.app verified."


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # VERIFY ANDROID PROJECT
      # ==========================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ANDROID PROJECT"
          echo "=========================================="

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle

          chmod +x android/gradlew

          echo "SUCCESS: Android project verified."


      # ==========================================
      # CAPACITOR SYNC
      # ==========================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SYNCING CAPACITOR"
          echo "=========================================="

          npx cap sync android

          echo ""
          echo "SUCCESS: Capacitor sync completed."


      # ==========================================
      # CHECK SIGNING SECRETS
      # ==========================================

      - name: Check Android signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "SUCCESS: All signing secrets exist."


      # ==========================================
      # DECODE KEYSTORE
      # ==========================================

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "Decoding Android signing keystore..."

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/insightly-release.keystore

          test -s android/insightly-release.keystore

          echo "SUCCESS: Keystore decoded."


      # ==========================================
      # BUILD SIGNED APK + AAB
      # ==========================================

      - name: Build signed APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd android

          echo "=========================================="
          echo "BUILDING SIGNED ANDROID APPLICATION"
          echo "=========================================="

          ./gradlew clean

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/insightly-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"


      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          echo "Checking APK..."

          test -f "$APK"

          echo ""
          echo "SUCCESS: SIGNED APK CREATED"
          ls -lh "$APK"


      # ==========================================
      # VERIFY AAB
      # ==========================================

      - name: Verify signed AAB
        shell: bash
        run: |
          set -e

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          echo "Checking AAB..."

          test -f "$AAB"

          echo ""
          echo "SUCCESS: SIGNED AAB CREATED"
          ls -lh "$AAB"


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


      # ==========================================
      # UPLOAD AAB
      # ==========================================

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # ==========================================
      # FINAL SUCCESS
      # ==========================================

      - name: Build complete
        run: |
          echo ""
          echo "=========================================="
          echo "INSIGHTLY ANDROID BUILD COMPLETE"
          echo "=========================================="
          echo ""
          echo "SIGNED APK: READY FOR TESTING"
          echo "SIGNED AAB: READY FOR GOOGLE PLAY"
          echo ""
