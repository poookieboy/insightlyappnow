name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -e

          echo "Checking build output..."

          if [ ! -d ".output/public" ]; then
            echo "ERROR: .output/public does not exist."
            echo "Available build directories:"
            find . -maxdepth 3 -type d \( -name "dist" -o -name "public" -o -name ".output" \) -print
            exit 1
          fi

          echo "Build output found:"
          find .output/public -maxdepth 2 -type f | head -50

          mkdir -p dist

          cp -a .output/public/. dist/

          echo "Capacitor assets prepared:"
          ls -la dist

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "dist/index.html found successfully."

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks
          test -s release-key.jks

      - name: Build Signed AAB
        working-directory: android
        run: |
          gradle clean bundleRelease \
            "-Pandroid.injected.signing.store.file=../release-key.jks" \
            "-Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}" \
            "-Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}" \
            "-Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}"

      - name: Verify AAB exists
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
