name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "BUILDING INSIGHTLY WEB APPLICATION"
          echo "======================================"

          npm run build

          BUILD_STATUS=$?

          echo ""
          echo "npm run build exit code: $BUILD_STATUS"
          echo ""

          if [ -f ".output/public/index.html" ]; then
            echo "======================================"
            echo "WEB ASSETS FOUND"
            echo "======================================"
            echo "Found: .output/public/index.html"
            echo ""

            if [ "$BUILD_STATUS" -ne 0 ]; then
              echo "WARNING: npm run build returned an error"
              echo "but the usable public web assets were generated."
              echo "Continuing with the Capacitor Android build."
            fi

            exit 0
          fi

          if [ -f "dist/index.html" ]; then
            echo "======================================"
            echo "WEB ASSETS FOUND"
            echo "======================================"
            echo "Found: dist/index.html"
            exit 0
          fi

          echo "======================================"
          echo "ERROR: NO USABLE WEB BUILD"
          echo "======================================"
          echo ""
          echo "Searching for index.html files..."
          find . -maxdepth 6 -type f -name "index.html" -print

          echo ""
          echo "Searching .output..."
          if [ -d ".output" ]; then
            find .output -maxdepth 5 -type f | head -150
          else
            echo ".output does not exist."
          fi

          echo ""
          echo "The web build did not produce usable files."
          exit "${BUILD_STATUS:-1}"

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PREPARING CAPACITOR WEB ASSETS"
          echo "======================================"

          if [ -f ".output/public/index.html" ]; then
            echo "Using .output/public"

            rm -rf dist
            mkdir -p dist
            cp -R .output/public/. dist/

          elif [ -f "dist/index.html" ]; then
            echo "Using existing dist directory."

          elif [ -f "build/index.html" ]; then
            echo "Using build directory."

            rm -rf dist
            mkdir -p dist
            cp -R build/. dist/

          elif [ -f "public/index.html" ]; then
            echo "Using public directory."

            rm -rf dist
            mkdir -p dist
            cp -R public/. dist/

          else
            echo "ERROR: Could not find web assets."
            exit 1
          fi

          echo ""
          echo "Checking final Capacitor directory..."

          test -f dist/index.html

          echo "✅ dist/index.html exists."
          echo ""

          echo "Files inside dist:"
          find dist -maxdepth 2 -type f | head -100

      - name: Show Capacitor configuration
        run: |
          echo "======================================"
          echo "CAPACITOR CONFIGURATION"
          echo "======================================"
          cat capacitor.config.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify Android project
        run: |
          echo "Checking Android project..."

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "✅ Android project verified."

      - name: Sync Capacitor
        run: |
          echo "======================================"
          echo "SYNCING CAPACITOR"
          echo "======================================"

          npx cap sync android

      - name: Verify signing secret
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "✅ KEYSTORE_BASE64 secret is available."

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/insightly-release.keystore

          if [ ! -s android/insightly-release.keystore ]; then
            echo "ERROR: Keystore could not be decoded."
            exit 1
          fi

          echo "✅ Signing keystore decoded."

      - name: Build signed Android APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android

          echo "======================================"
          echo "BUILDING SIGNED APK + AAB"
          echo "======================================"

          ./gradlew clean

          ./gradlew \
            bundleRelease \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/insightly-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK and AAB
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APK="android/app/build/outputs/apk/release/app-release.apk"

          echo "======================================"
          echo "VERIFYING ANDROID BUILDS"
          echo "======================================"

          if [ ! -f "$AAB" ]; then
            echo "❌ AAB was not created."
            exit 1
          fi

          if [ ! -f "$APK" ]; then
            echo "❌ APK was not created."
            exit 1
          fi

          echo ""
          echo "✅ SIGNED AAB CREATED"
          ls -lh "$AAB"

          echo ""
          echo "✅ SIGNED APK CREATED"
          ls -lh "$APK"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build complete
        run: |
          echo ""
          echo "======================================"
          echo "🎉 INSIGHTLY ANDROID BUILD COMPLETE"
          echo "======================================"
          echo ""
          echo "APK: signed and ready for testing"
          echo "AAB: signed and ready for Google Play"
