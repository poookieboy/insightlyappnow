# Android Build — builds web, prepares Capacitor assets, syncs, builds signed AAB + APK, uploads artifacts.
name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing Capacitor web assets for Capacitor (webDir=dist)"
          echo "========================================"

          # If dist already exists and contains index.html, use it.
          if [ -f "dist/index.html" ]; then
            echo "Found dist/index.html — using dist as web assets."
          else
            # If .output/public exists and contains index.html, copy it into dist.
            if [ -d ".output/public" ] && [ -f ".output/public/index.html" ]; then
              echo "Found .output/public/index.html — copying .output/public -> dist"
              rm -rf dist
              mkdir -p dist
              cp -a .output/public/. dist/
            else
              # Try a fallback static build to create dist (this uses Vite directly)
              echo ""
              echo "Neither dist/index.html nor .output/public/index.html found. Attempting a fallback static Vite build (outDir=dist)..."
              echo "Directory candidates (top-level):"
              find . -maxdepth 3 -type d \( -name "dist" -o -name ".output" -o -name "public" -o -name "build" \) -not -path "./node_modules/*" -not -path "./android/*" -print || true
              echo "---"
              echo "Running: npx vite build --outDir dist"
              npx vite build --outDir dist || true

              if [ -f "dist/index.html" ]; then
                echo "Fallback Vite build created dist/index.html — continuing."
              else
                echo ""
                echo "ERROR: Could not create a Capacitor-compatible web build."
                echo "Checked:"
                echo " - dist/index.html -> $( [ -f dist/index.html ] && echo yes || echo no )"
                echo " - .output/public/index.html -> $( [ -f .output/public/index.html ] && echo yes || echo no )"
                echo ""
                echo "Full .output listing (if present):"
                if [ -d ".output" ]; then find .output -maxdepth 6 -print || true; fi
                echo ""
                echo "Full project root files:"
                ls -la || true
                exit 1
              fi
            fi
          fi

          echo ""
          echo "Final dist contents (head):"
          find dist -maxdepth 4 -type f -print | sort | head -200 || true

          if [ ! -f "dist/index.html" ]; then
            echo ""
            echo "ERROR: dist/index.html is missing after preparation."
            exit 1
          fi

          echo ""
          echo "SUCCESS: dist/index.html exists and is ready for Capacitor."

      - name: Show Capacitor config for debugging
        run: |
          echo "capacitor.config.json:"
          cat capacitor.config.json || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "android/gradlew is executable"
          else
            echo "WARNING: android/gradlew not found; CI will try system gradle. Prefer committing gradlew to repo."
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "Checking Android project"
          echo "========================================"
          if [ ! -d "android" ]; then
            echo "ERROR: android/ directory does not exist."
            exit 1
          fi
          echo "Android files (sample):"
          find android -maxdepth 3 -type f \( -name "*.gradle" -o -name "AndroidManifest.xml" -o -name "build.gradle" \) -print | sort

      - name: Decode Keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks
          if [ ! -s release-key.jks ]; then
            echo "ERROR: release-key.jks is empty or not created."
            exit 1
          fi
          echo "Keystore decoded: release-key.jks (size: $(du -h release-key.jks | awk '{print $1}'))"

      - name: Build signed AAB and APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "Building signed App Bundle (AAB) and APK"
          echo "========================================"

          # Prefer Gradle wrapper when available
          GRADLE_CMD="./gradlew"
          if [ ! -x "$GRADLE_CMD" ]; then
            echo "Gradle wrapper not found or not executable; trying system gradle command 'gradle'"
            GRADLE_CMD="gradle"
          fi

          echo "Using gradle command: $GRADLE_CMD"
          echo "Gradle version:"
          $GRADLE_CMD --version || true

          # Clean and build both artifacts; passing signing properties via -P
          $GRADLE_CMD clean bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=../release-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Verify outputs and print sizes
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          echo "========================================"
          echo "Checking outputs"
          echo "========================================"

          echo "Looking for AAB (path): $AAB_PATH"
          if [ ! -f "$AAB_PATH" ]; then
            echo ""
            echo "ERROR: AAB not found at expected path."
            echo "Available .aab files:"
            find android/app/build/outputs -type f -name "*.aab" -print || true
            exit 1
          fi

          echo "Looking for APK (path): $APK_PATH"
          if [ ! -f "$APK_PATH" ]; then
            echo ""
            echo "ERROR: APK not found at expected path."
            echo "Available APKs:"
            find android/app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          echo ""
          echo "AAB:"
          ls -lh "$AAB_PATH"
          echo "APK:"
          ls -lh "$APK_PATH"

      - name: Upload Signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
