# Android Build - builds web, prepares Capacitor assets,
# syncs Android, builds signed AAB + APK, and uploads artifacts.

name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # IMPORTANT:
      # npm ci was failing because package.json and package-lock.json
      # are currently out of sync.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing Capacitor web assets"
          echo "========================================"

          if [ -f "dist/index.html" ]; then
            echo "Found dist/index.html"

          elif [ -d ".output/public" ] && [ -f ".output/public/index.html" ]; then
            echo "Found .output/public/index.html"
            echo "Copying .output/public -> dist"

            rm -rf dist
            mkdir -p dist
            cp -a .output/public/. dist/

          else
            echo "No compatible web output found."
            echo "Attempting fallback Vite build..."

            rm -rf dist

            npx vite build --outDir dist

            if [ ! -f "dist/index.html" ]; then
              echo ""
              echo "ERROR: Could not create dist/index.html"
              echo ""
              echo "Project directories:"
              find . -maxdepth 3 -type d \
                \( -name "dist" -o -name ".output" -o -name "build" -o -name "public" \) \
                -not -path "./node_modules/*" \
                -not -path "./android/*" \
                -print || true

              echo ""
              echo "Full .output listing:"
              if [ -d ".output" ]; then
                find .output -maxdepth 6 -print || true
              fi

              exit 1
            fi
          fi

          echo ""
          echo "========================================"
          echo "Final web assets"
          echo "========================================"

          find dist -maxdepth 4 -type f -print | sort | head -200 || true

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html is missing."
            exit 1
          fi

          echo ""
          echo "SUCCESS: dist/index.html exists."

      - name: Show Capacitor config
        run: |
          echo "========================================"
          echo "Capacitor configuration"
          echo "========================================"

          if [ -f "capacitor.config.json" ]; then
            cat capacitor.config.json
          else
            echo "ERROR: capacitor.config.json not found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Ensure Gradle wrapper is executable
        shell: bash
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "android/gradlew is executable"
          else
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking Android project"
          echo "========================================"

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERROR: android/app/build.gradle does not exist."
            exit 1
          fi

          echo "Android project found."

          echo ""
          echo "Android files:"
          find android -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "AndroidManifest.xml" \) \
            -print | sort

      - name: Decode Keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

          if [ ! -s release-key.jks ]; then
            echo "ERROR: release-key.jks is empty."
            exit 1
          fi

          echo "Keystore decoded successfully."

      - name: Build signed AAB and APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building signed AAB and APK"
          echo "========================================"

          GRADLE_CMD="./gradlew"

          chmod +x "$GRADLE_CMD"

          echo "Gradle version:"
          "$GRADLE_CMD" --version

          echo ""
          echo "Starting release build..."

          "$GRADLE_CMD" clean bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=../release-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail

          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          echo "========================================"
          echo "Checking release files"
          echo "========================================"

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: Signed AAB was not created."

            echo ""
            echo "Available AAB files:"
            find android/app/build/outputs \
              -type f \
              -name "*.aab" \
              -print || true

            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Signed APK was not created."

            echo ""
            echo "Available APK files:"
            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

          echo ""
          echo "Signed AAB:"
          ls -lh "$AAB_PATH"

          echo ""
          echo "Signed APK:"
          ls -lh "$APK_PATH"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
