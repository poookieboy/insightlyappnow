name: Insightly Android Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Signed Android APK and AAB
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. NODE
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # --------------------------------------------------
      # 3. INSTALL DEPENDENCIES
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund


      # --------------------------------------------------
      # 4. BUILD WEB APPLICATION
      # --------------------------------------------------

      - name: Build web application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING INSIGHTLY WEB APPLICATION"
          echo "=========================================="

          npm run build

          echo ""
          echo "=========================================="
          echo "CHECKING WEB BUILD OUTPUT"
          echo "=========================================="

          if [ -f "dist/index.html" ]; then
            echo "SUCCESS: dist/index.html exists."

          elif [ -f ".output/public/index.html" ]; then
            echo "SUCCESS: .output/public/index.html exists."

            echo "Copying .output/public into dist..."

            rm -rf dist
            mkdir -p dist

            cp -R .output/public/. dist/

          else
            echo ""
            echo "ERROR: No usable web build was produced."
            echo ""
            echo "Searching for index.html..."
            find . -maxdepth 7 -type f -name "index.html" -print

            echo ""
            echo "Searching for web output directories..."

            if [ -d ".output" ]; then
              find .output -maxdepth 5 -type f | head -200
            fi

            if [ -d "dist" ]; then
              find dist -maxdepth 5 -type f | head -200
            fi

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "VERIFYING DIST"
          echo "=========================================="

          test -f dist/index.html

          echo "SUCCESS: dist/index.html is ready."
          echo ""

          echo "Contents of dist:"
          find dist -maxdepth 2 -type f | head -100


      # --------------------------------------------------
      # 5. VERIFY CAPACITOR CONFIG
      # --------------------------------------------------

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CAPACITOR CONFIGURATION"
          echo "=========================================="

          test -f capacitor.config.json

          cat capacitor.config.json

          echo ""
          echo "Checking app ID..."

          grep -q '"com.insightly.app"' capacitor.config.json

          echo "SUCCESS: Insightly app ID verified."


      # --------------------------------------------------
      # 6. JAVA 17
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 7. VERIFY ANDROID PROJECT
      # --------------------------------------------------

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ANDROID PROJECT"
          echo "=========================================="

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle

          chmod +x android/gradlew

          echo "SUCCESS: Android project verified."


      # --------------------------------------------------
      # 8. CAPACITOR SYNC
      # --------------------------------------------------

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SYNCING CAPACITOR"
          echo "=========================================="

          npx cap sync android

          echo ""
          echo "SUCCESS: Capacitor sync completed."


      # --------------------------------------------------
      # 9. CHECK KEYSTORE SECRET
      # --------------------------------------------------

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking Android signing secrets..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "SUCCESS: All signing secrets are present."


      # --------------------------------------------------
      # 10. DECODE KEYSTORE
      # --------------------------------------------------

      - name: Decode Android keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "Decoding signing keystore..."

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/insightly-release.keystore

          test -s android/insightly-release.keystore

          echo "SUCCESS: Keystore decoded."


      # --------------------------------------------------
      # 11. BUILD SIGNED APK + AAB
      # --------------------------------------------------

      - name: Build signed APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd android

          echo "=========================================="
          echo "BUILDING SIGNED APK AND AAB"
          echo "=========================================="

          ./gradlew clean

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/insightly-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"


      # --------------------------------------------------
      # 12. VERIFY APK
      # --------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          echo "Checking APK..."

          test -f "$APK"

          echo ""
          echo "SUCCESS: Signed APK created."
          ls -lh "$APK"


      # --------------------------------------------------
      # 13. VERIFY AAB
      # --------------------------------------------------

      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          echo "Checking AAB..."

          test -f "$AAB"

          echo ""
          echo "SUCCESS: Signed AAB created."
          ls -lh "$AAB"


      # --------------------------------------------------
      # 14. UPLOAD APK
      # --------------------------------------------------

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


      # --------------------------------------------------
      # 15. UPLOAD AAB
      # --------------------------------------------------

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # --------------------------------------------------
      # 16. SUCCESS
      # --------------------------------------------------

      - name: Build successful
        run: |
          echo ""
          echo "=========================================="
          echo "       INSIGHTLY ANDROID BUILD COMPLETE"
          echo "=========================================="
          echo ""
          echo "SIGNED APK: READY FOR TESTING"
          echo "SIGNED AAB: READY FOR GOOGLE PLAY"
          echo ""
          echo "=========================================="
