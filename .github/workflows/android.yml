name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Get the source code
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Node.js
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --------------------------------------------------
      # 3. Install JavaScript dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 4. Build the web application
      # --------------------------------------------------
      - name: Build web app
        run: npm run build

      # --------------------------------------------------
      # 5. Find the actual web build output
      #    and prepare Capacitor's dist directory
      # --------------------------------------------------
      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking web build output"
          echo "========================================"

          echo ""
          echo "Root directory:"
          ls -la

          echo ""
          echo "Searching for index.html:"
          find . \
            -type f \
            -name "index.html" \
            -not -path "./node_modules/*" \
            -not -path "./android/*" \
            -not -path "./dist/*" \
            -print

          echo ""
          echo "Searching for possible build directories:"
          find . \
            -maxdepth 4 \
            -type d \
            \( -name "dist" -o -name ".output" -o -name "build" -o -name "public" \) \
            -not -path "./node_modules/*" \
            -not -path "./android/*" \
            -print

          echo ""
          echo "========================================"
          echo "Finding web entry point"
          echo "========================================"

          INDEX_FILE=$(find . \
            -type f \
            -name "index.html" \
            -not -path "./node_modules/*" \
            -not -path "./android/*" \
            -not -path "./dist/*" \
            -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo ""
            echo "ERROR: No index.html was produced by npm run build."
            echo ""
            echo "Build output:"
            find . \
              -maxdepth 4 \
              -type f \
              -not -path "./node_modules/*" \
              -not -path "./android/*" \
              | head -200
            exit 1
          fi

          echo "Found index.html at:"
          echo "$INDEX_FILE"

          SOURCE_DIR=$(dirname "$INDEX_FILE")

          echo ""
          echo "Web source directory:"
          echo "$SOURCE_DIR"

          echo ""
          echo "========================================"
          echo "Preparing dist directory"
          echo "========================================"

          mkdir -p dist

          cp -a "$SOURCE_DIR"/. dist/

          echo ""
          echo "Contents of dist:"
          find dist -maxdepth 2 -type f | head -100

          if [ ! -f "dist/index.html" ]; then
            echo ""
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo ""
          echo "SUCCESS: Capacitor web assets prepared."
          echo "dist/index.html exists."

      # --------------------------------------------------
      # 6. Sync the web application into Android
      # --------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android

      # --------------------------------------------------
      # 7. Set up Java
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # --------------------------------------------------
      # 8. Set up Gradle 8.7
      # --------------------------------------------------
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # --------------------------------------------------
      # 9. Decode the Android release keystore
      # --------------------------------------------------
      - name: Decode Keystore
        run: |
          set -e

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

          if [ ! -s release-key.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore decoded successfully."

      # --------------------------------------------------
      # 10. Build the signed Android App Bundle
      # --------------------------------------------------
      - name: Build Signed AAB
        working-directory: android
        run: |
          gradle clean bundleRelease \
            "-Pandroid.injected.signing.store.file=../release-key.jks" \
            "-Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}" \
            "-Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}" \
            "-Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}"

      # --------------------------------------------------
      # 11. Verify that the AAB was actually created
      # --------------------------------------------------
      - name: Verify AAB exists
        run: |
          set -e

          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB was not created."
            echo ""
            echo "Available bundle files:"
            find android/app/build/outputs -type f -name "*.aab" -print || true
            exit 1
          fi

          echo "AAB successfully created:"
          ls -lh "$AAB_PATH"

      # --------------------------------------------------
      # 12. Upload the signed AAB to GitHub Actions
      # --------------------------------------------------
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
