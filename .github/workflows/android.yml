name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Build the Lovable/TanStack web application.
      # The generated public files are normally placed in .output/public.
      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -e

          echo "Checking web build output..."

          if [ -f ".output/public/index.html" ]; then
            echo "Found .output/public/index.html"

            rm -rf dist
            mkdir -p dist
            cp -R .output/public/. dist/

          elif [ -f "dist/index.html" ]; then
            echo "Found dist/index.html"

          else
            echo "ERROR: No web build was found."
            echo ""
            echo "Contents of the repository root:"
            ls -la
            echo ""
            echo "Contents of .output, if present:"
            if [ -d ".output" ]; then
              find .output -maxdepth 3 -type f | head -100
            else
              echo ".output does not exist"
            fi
            exit 1
          fi

          echo ""
          echo "Final Capacitor web assets:"
          find dist -maxdepth 2 -type f | head -100

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo ""
          echo "SUCCESS: dist/index.html exists."

      - name: Show Capacitor config
        run: |
          echo "Capacitor configuration:"
          cat capacitor.config.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          echo "Android project verified."

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/insightly-release.keystore

          test -s android/insightly-release.keystore
          echo "Keystore decoded successfully."

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android

          ./gradlew clean

          ./gradlew \
            bundleRelease \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/insightly-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK and AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not created."
            exit 1
          fi

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "================================"
          echo "SIGNED ANDROID BUILDS CREATED"
          echo "================================"
          echo ""
          ls -lh "$AAB"
          ls -lh "$APK"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Insightly-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
