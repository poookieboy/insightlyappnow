name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparing Capacitor web assets"
          echo "========================================"

          rm -rf dist
          mkdir -p dist

          if [ ! -d ".output/public" ]; then
            echo ""
            echo "ERROR: .output/public does not exist."
            echo ""
            echo "Available build directories:"
            find . \
              -maxdepth 4 \
              -type d \
              \( -name "dist" -o -name ".output" -o -name "build" -o -name "public" \) \
              -not -path "./node_modules/*" \
              -not -path "./android/*" \
              -print
            exit 1
          fi

          echo ""
          echo "Found web build output:"
          echo ".output/public"

          echo ""
          echo "Inspecting generated files:"
          find .output/public \
            -maxdepth 3 \
            -type f \
            -print | sort | head -200

          # Copy the complete TanStack Start public output.
          cp -a .output/public/. dist/

          # TanStack Start SPA builds may provide the application shell
          # as _shell.html instead of index.html.
          if [ -f "dist/_shell.html" ]; then
            echo ""
            echo "Found TanStack Start SPA shell: _shell.html"
            echo "Creating Capacitor entry point: index.html"

            cp "dist/_shell.html" "dist/index.html"
          fi

          # If a normal index.html was generated, use it directly.
          if [ -f "dist/index.html" ]; then
            echo ""
            echo "SUCCESS: dist/index.html exists."
          else
            echo ""
            echo "ERROR: Capacitor requires dist/index.html."
            echo ""
            echo "No index.html or _shell.html was generated."
            echo ""
            echo "Final generated files:"
            find dist \
              -maxdepth 3 \
              -type f \
              -print | sort | head -200
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Final Capacitor web assets"
          echo "========================================"

          find dist \
            -maxdepth 3 \
            -type f \
            -print | sort | head -200

          echo ""
          echo "SUCCESS: Capacitor web assets prepared."
          echo "dist/index.html is ready."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Keystore
        run: |
          set -e

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

          if [ ! -s release-key.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore decoded successfully."

      - name: Build Signed AAB
        working-directory: android
        run: |
          gradle clean bundleRelease \
            "-Pandroid.injected.signing.store.file=../release-key.jks" \
            "-Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}" \
            "-Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}" \
            "-Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}"

      - name: Verify AAB exists
        run: |
          set -e

          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB was not created."
            echo ""
            echo "Available bundle files:"
            find android/app/build/outputs -type f -name "*.aab" -print || true
            exit 1
          fi

          echo "AAB successfully created:"
          ls -lh "$AAB_PATH"

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
