name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ========================================
      # NODE.JS
      # ========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # ========================================
      # INSTALL DEPENDENCIES
      # ========================================
      - name: Install dependencies
        run: npm install

      # ========================================
      # BUILD WEB APP
      # ========================================
      - name: Build web app
        run: npm run build

      # ========================================
      # PREPARE CAPACITOR WEB ASSETS
      # ========================================
      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparing Capacitor web assets"
          echo "========================================"

          echo ""
          echo "Checking build output..."

          if [ ! -d ".output/public" ]; then
            echo ""
            echo "ERROR: .output/public does not exist."
            echo ""
            echo "Available build directories:"
            find . \
              -maxdepth 4 \
              -type d \
              \( \
                -name "dist" \
                -o -name ".output" \
                -o -name "build" \
                -o -name "public" \
              \) \
              -not -path "./node_modules/*" \
              -not -path "./android/*" \
              -print

            echo ""
            echo "Build output tree:"
            find .output \
              -maxdepth 4 \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "FOUND:"
          echo ".output/public"

          echo ""
          echo "Files inside .output/public:"
          find .output/public \
            -maxdepth 5 \
            -type f \
            -print | sort | head -300

          echo ""
          echo "Preparing dist directory..."

          rm -rf dist
          mkdir -p dist

          echo ""
          echo "Copying .output/public -> dist..."

          cp -R .output/public/. dist/

          echo ""
          echo "Contents of dist:"
          find dist \
            -maxdepth 5 \
            -type f \
            -print | sort | head -300

          echo ""
          echo "Checking index.html..."

          if [ ! -f "dist/index.html" ]; then
            echo ""
            echo "ERROR: dist/index.html was NOT created."
            echo ""
            echo "The TanStack build output does not contain a root index.html."
            echo ""
            echo "Full .output/public contents:"
            find .output/public \
              -maxdepth 10 \
              -print | sort | head -500

            echo ""
            echo "Full dist contents:"
            find dist \
              -maxdepth 10 \
              -print | sort | head -500

            exit 1
          fi

          echo ""
          echo "SUCCESS: dist/index.html exists."

          echo ""
          echo "========================================"
          echo "Capacitor assets prepared successfully"
          echo "========================================"

      # ========================================
      # JAVA
      # ========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ========================================
      # GRADLE
      # ========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # ========================================
      # CAPACITOR SYNC
      # ========================================
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ========================================
      # VERIFY ANDROID PROJECT
      # ========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking Android project"
          echo "========================================"

          if [ ! -d "android" ]; then
            echo "ERROR: android/ directory does not exist."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERROR: android/app/build.gradle does not exist."
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ]; then
            echo "ERROR: android/settings.gradle does not exist."
            exit 1
          fi

          echo ""
          echo "Android project found successfully."

          echo ""
          echo "Android Gradle files:"
          find android \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
            \) \
            -print | sort

      # ========================================
      # DECODE SIGNING KEYSTORE
      # ========================================
      - name: Decode Keystore
        shell: bash
        run: |
          set -e

          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

          if [ ! -s release-key.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore decoded successfully."

      # ========================================
      # BUILD SIGNED AAB
      # ========================================
      - name: Build Signed AAB
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Building signed Android App Bundle"
          echo "========================================"

          gradle clean bundleRelease \
            "-Pandroid.injected.signing.store.file=../release-key.jks" \
            "-Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}" \
            "-Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}" \
            "-Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}"

      # ========================================
      # VERIFY AAB
      # ========================================
      - name: Verify AAB exists
        shell: bash
        run: |
          set -e

          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          echo "========================================"
          echo "Checking AAB"
          echo "========================================"

          if [ ! -f "$AAB_PATH" ]; then
            echo ""
            echo "ERROR: AAB was not created."
            echo ""
            echo "Available bundle files:"

            find android/app/build/outputs \
              -type f \
              -name "*.aab" \
              -print || true

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "AAB SUCCESSFULLY CREATED"
          echo "========================================"

          echo ""
          ls -lh "$AAB_PATH"

      # ========================================
      # UPLOAD AAB
      # ========================================
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
