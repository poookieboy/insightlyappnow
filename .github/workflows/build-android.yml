name: Build Insightly Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app for Capacitor
        run: npm run build

      - name: Verify Capacitor web output
        run: |
          test -f dist/client/index.html
          test -d dist/client/assets

          echo "Insightly web entry:"
          sed -n '1,80p' dist/client/index.html

          echo "Web assets:"
          find dist/client/assets -maxdepth 1 -type f | sort | head -100

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: insightly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: insightly-android-project
          path: android
          if-no-files-found: error
