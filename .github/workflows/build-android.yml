name: Build Android
run-name: "Android build (${{ inputs.build_id }})"

on:
  workflow_dispatch:
    inputs:
      project_id:   { description: "Lovable project ID", required: true, type: string }
      build_id:     { description: "Lovable build ID",   required: true, type: string }
      config:       { description: "JSON-encoded build configuration", required: true, type: string }

concurrency:
  group: android-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      LOVABLE_PROJECT_ID: ${{ inputs.project_id }}
      LOVABLE_BUILD_ID:   ${{ inputs.build_id }}
      APP_VERSION:        ${{ fromJSON(inputs.config).app_version }}
      BUILD_NUMBER:       ${{ fromJSON(inputs.config).build_number }}
      APP_NAME:           ${{ fromJSON(inputs.config).app_name }}
      BUNDLE_ID:          ${{ fromJSON(inputs.config).bundle_id }}
      REPORT_URL:         ${{ fromJSON(inputs.config).report_url }}
      REPORT_TOKEN:       ${{ fromJSON(inputs.config).report_token }}
      BUILD_TYPE:         ${{ fromJSON(inputs.config).build_type }}
      SKIP_ARTIFACT_UPLOAD: ${{ fromJSON(inputs.config).skip_artifact_upload }}
    steps:

      - name: Configure Lovable reporter
        shell: bash
        run: |
          cat > /tmp/lov_report <<'BASH'
          #!/usr/bin/env bash
          set -u

          post_payload() {
            # Capture response so validation errors from report-build (e.g.
            # rejected artifacts) surface in the runner log instead of being
            # silently dropped.
            local resp http
            resp="$(curl -sS -o /tmp/lov_report_resp -w '%{http_code}' -X POST -H "Content-Type: application/json" --data "$1" "$REPORT_URL" 2>/dev/null || echo 000)"
            http="$resp"
            if [ "$http" != "200" ] && [ "$http" != "000" ]; then
              echo "::warning::report-build returned HTTP $http" >&2
              head -c 4000 /tmp/lov_report_resp >&2 || true
              echo >&2
            elif [ -s /tmp/lov_report_resp ] && grep -q '"artifact_errors"' /tmp/lov_report_resp 2>/dev/null; then
              echo "::warning::report-build accepted request but rejected one or more artifacts:" >&2
              head -c 4000 /tmp/lov_report_resp >&2 || true
              echo >&2
            fi
          }

          make_payload() {
            python3 - "$@" <<'PYJSON'
          import json, os, sys
          mode = sys.argv[1] if len(sys.argv) > 1 else ""
          payload = {
              "build_id": os.environ.get("LOVABLE_BUILD_ID", ""),
              "token": os.environ.get("REPORT_TOKEN", ""),
          }
          if mode == "status":
              payload["status"] = sys.argv[2] if len(sys.argv) > 2 else "building"
          elif mode == "log":
              payload["log"] = sys.argv[2] if len(sys.argv) > 2 else ""
              payload["level"] = sys.argv[3] if len(sys.argv) > 3 else "info"
          elif mode == "fingerprint":
              # Signing certificate fingerprints only. Never carries passwords
              # or raw keytool output.
              payload["keystore_sha1"] = sys.argv[2] if len(sys.argv) > 2 else ""
              payload["keystore_sha256"] = sys.argv[3] if len(sys.argv) > 3 else ""
          elif mode == "final":
              payload["status"] = sys.argv[2] if len(sys.argv) > 2 else "failed"
              payload["error_message"] = sys.argv[3] if len(sys.argv) > 3 else ""
              if len(sys.argv) > 4 and sys.argv[4]:
                  payload["failed_step"] = sys.argv[4]
              if len(sys.argv) > 5 and sys.argv[5]:
                  payload["error_summary"] = sys.argv[5]
              if len(sys.argv) > 6 and sys.argv[6]:
                  payload["error_category"] = sys.argv[6]
          elif mode == "fail":
              # args: step, summary, tail_file, category
              payload["failed_step"] = sys.argv[2] if len(sys.argv) > 2 else ""
              payload["error_summary"] = sys.argv[3] if len(sys.argv) > 3 else ""
              tail_file = sys.argv[4] if len(sys.argv) > 4 else ""
              if len(sys.argv) > 5 and sys.argv[5]:
                  payload["error_category"] = sys.argv[5]
              if tail_file and os.path.exists(tail_file):
                  try:
                      with open(tail_file, "r", errors="replace") as fh:
                          lines = [l.rstrip("\n") for l in fh.readlines()]
                      payload["log_tail"] = lines[-80:]
                  except Exception:
                      pass
          elif mode == "artifacts":
              # args: one or more glob-expanded file paths produced by the build.
              # For each file: hash it, request a signed upload URL for the
              # private 'artifacts' bucket, PUT the bytes directly to Storage,
              # then include storage_path in the artifacts payload so the
              # download UI can mint fresh expiring signed URLs.
              import glob, hashlib, urllib.request, urllib.error
              report_url = os.environ.get("REPORT_URL", "")
              base = report_url.rsplit("/", 1)[0]  # strip trailing /report-build
              upload_endpoint = base + "/artifact-upload-url"
              build_id = os.environ.get("LOVABLE_BUILD_ID", "")
              token = os.environ.get("REPORT_TOKEN", "")
              seen = set()
              artifacts = []
              for pattern in sys.argv[2:]:
                  for path in sorted(glob.glob(pattern)):
                      if not os.path.isfile(path) or path in seen:
                          continue
                      seen.add(path)
                      name = os.path.basename(path)
                      lower = name.lower()
                      kind = ("apk" if lower.endswith(".apk")
                              else "aab" if lower.endswith(".aab")
                              else "ipa" if lower.endswith(".ipa")
                              else "other")
                      if kind == "other":
                          continue
                      try:
                          size = os.path.getsize(path)
                      except OSError:
                          size = None
                      sha = hashlib.sha256()
                      try:
                          with open(path, "rb") as fh:
                              for chunk in iter(lambda: fh.read(1 << 20), b""):
                                  sha.update(chunk)
                          digest = sha.hexdigest()
                      except OSError:
                          digest = None
                      storage_path = None
                      try:
                          req = urllib.request.Request(
                              upload_endpoint,
                              data=json.dumps({"build_id": build_id, "token": token, "filename": name}).encode(),
                              headers={"Content-Type": "application/json"},
                              method="POST",
                          )
                          with urllib.request.urlopen(req, timeout=30) as resp:
                              signed = json.loads(resp.read())
                          upload_url = signed.get("upload_url")
                          storage_path = signed.get("path")
                          if upload_url and storage_path:
                              with open(path, "rb") as fh:
                                  put = urllib.request.Request(
                                      upload_url,
                                      data=fh.read(),
                                      headers={"Content-Type": "application/octet-stream", "x-upsert": "true"},
                                      method="PUT",
                                  )
                                  urllib.request.urlopen(put, timeout=600).read()
                      except (urllib.error.URLError, urllib.error.HTTPError, OSError, ValueError) as exc:
                          sys.stderr.write("artifact upload failed for {}: {}\n".format(name, exc))
                          storage_path = None
                      artifacts.append({
                          "filename": name,
                          "kind": kind,
                          "size_bytes": size,
                          "sha256": digest,
                          "storage_path": storage_path,
                      })
              payload["artifacts"] = artifacts
          print(json.dumps(payload))
          PYJSON
          }


          extract_summary() {
            # Pick the most descriptive line from a log file: prefer first line
            # containing error/failed/exception, else the last non-empty line.
            local file="$1"
            local s
            s="$(grep -iE '(^npm (ERR!|error)|ERESOLVE|EUSAGE|Could not find|Unable to resolve|Capacitor.*(error|failed)|failed to|exception|fatal|denied)' "$file" 2>/dev/null | head -n 1 || true)"
            if [ -z "$s" ]; then
              s="$(grep -iE 'error|failed|exception|fatal|denied' "$file" 2>/dev/null | head -n 1 || true)"
            fi
            if [ -z "$s" ]; then
              # Last non-empty line. Deliberately not `tac`: that is GNU
              # coreutils and does not exist on the macOS runners used for iOS,
              # so this fallback silently produced an empty summary there.
              s="$(grep -E '\S' "$file" 2>/dev/null | tail -n 1 || true)"
            fi
            # Trim and cap length
            printf '%s' "$s" | tr -d '\r' | cut -c1-400
          }

          classify_error() {
            # Emit a single structured category the UI can render as a badge.
            # Order matters: signing/github-app checked first so they aren't
            # shadowed by generic gradle/xcode failures they trigger.
            local step="$1"
            local file="$2"
            local haystack=""
            [ -n "$step" ] && haystack="$step "
            if [ -n "$file" ] && [ -f "$file" ]; then
              haystack="$haystack$(tail -c 20000 "$file" 2>/dev/null || true)"
            fi
            local lc
            lc="$(printf '%s' "$haystack" | tr '[:upper:]' '[:lower:]')"
            case "$lc" in
              *"github app"*|*"app not installed"*|*"installation not found"*|*"resource not accessible by integration"*|*"bad credentials"*|*"repository not accessible"*)
                printf 'github_app_error'; return ;;
            esac
            case "$lc" in
              *"command not found"*|*"is not recognized as"*|*"executable file not found"*|*"/usr/bin/env:"*)
                printf 'missing_tool_error'; return ;;
            esac
            case "$lc" in
              *"could not resolve entry module"*|*"no index.html"*|*"npm error code enoent"*|*"missing script: \"build\""*|*"no package.json"*|*"enoent: no such file or directory, open 'package.json'"*)
                printf 'project_structure_error'; return ;;
            esac
            case "$lc" in
              *"keystore"*|*"jarsigner"*|*"apksigner"*|*"code sign"*|*"codesign"*|*"provisioning profile"*|*"no signing certificate"*|*"apple_cert"*|*"android_key"*|*"signingconfig"*)
                printf 'signing_error'; return ;;
            esac
            # Transient infrastructure is checked BEFORE the tool-specific
            # buckets. A Gradle or Xcode step that dies on a socket timeout is a
            # timeout, not a build-config bug, and labelling it gradle_error
            # sends the user to rewrite build.gradle instead of re-running.
            # Order must match classifyBuildError() in _shared/projectDetection.ts.
            case "$lc" in
              *"etimedout"*|*"timed out"*|*"timeout"*|*"deadline exceeded"*)
                printf 'timeout_error'; return ;;
            esac
            case "$lc" in
              *"econnreset"*|*"econnrefused"*|*"getaddrinfo"*|*"network is unreachable"*|*"could not resolve host"*|*"tls handshake"*)
                printf 'network_error'; return ;;
            esac
            case "$lc" in
              *"gradle"*|*"aapt"*|*"execution failed for task"*|*":app:"*)
                printf 'gradle_error'; return ;;
            esac
            case "$lc" in
              *"xcodebuild"*|*"xcode "*|*"** archive failed"*|*"** export failed"*|*"exportarchive"*)
                printf 'xcode_error'; return ;;
            esac
            case "$lc" in
              *"cocoapods"*|*"pod install"*|*"pod repo"*|*"cdn: trunk"*)
                printf 'cocoapods_error'; return ;;
            esac
            # NB: bare install commands ("npm ci", "npm install") are NOT
            # needles — the runner echoes the command before running it, so
            # matching them labelled every install failure an npm_error.
            case "$lc" in
              *"npm err"*|*"eresolve"*|*"eusage"*|*"peer dep"*|*"unable to resolve dependency"*|*"err_pnpm"*)
                printf 'npm_error'; return ;;
            esac
            case "$lc" in
              *"capacitor"*|*"cap sync"*|*"cap add"*)
                printf 'capacitor_error'; return ;;
            esac
            case "$lc" in
              *"error during build"*|*"build failed in"*|*"transform failed"*|*"rollup"*|*"vite build"*)
                printf 'web_build_error'; return ;;
            esac
            printf 'unknown'
          }


          mode="${1:-}"; shift || true
          if [ "$mode" = "status" ]; then
            post_payload "$(make_payload status "${1:-building}")"
          elif [ "$mode" = "log" ]; then
            post_payload "$(make_payload log "${1:-}" "${2:-info}")"
          elif [ "$mode" = "fingerprint" ]; then
            # fingerprint <sha1> <sha256>
            post_payload "$(make_payload fingerprint "${1:-}" "${2:-}")"
          elif [ "$mode" = "final" ]; then
            # final <status> <error_message> [failed_step] [error_summary] [error_category]
            post_payload "$(make_payload final "${1:-failed}" "${2:-}" "${3:-}" "${4:-}" "${5:-}")"
          elif [ "$mode" = "fail" ]; then
            # fail <step> <summary> <tail_file> [category]
            post_payload "$(make_payload fail "${1:-}" "${2:-}" "${3:-}" "${4:-}")"
          elif [ "$mode" = "artifacts" ]; then
            # artifacts <glob> [<glob>...] — hash each file & POST size + sha256
            post_payload "$(make_payload artifacts "$@")"
          elif [ "$mode" = "run" ]; then
            label="${1:-Step}"; shift || true
            tmp="$(mktemp)"
            "$0" log "$label"
            set +e
            # Use a pipeline, not `> >(tee "$tmp")`. With process substitution
            # the shell continues as soon as the command exits, so
            # extract_summary/classify_error below can read $tmp before tee has
            # flushed it — producing blank summaries and 'unknown' categories
            # for failures that actually had a clear cause in the log.
            "$@" 2>&1 | tee "$tmp"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              summary="$(extract_summary "$tmp")"
              [ -z "$summary" ] && summary="$label failed with exit code $status"
              category="$(classify_error "$label" "$tmp")"
              # Record the failing step so the final-status step can include it.
              echo "$label" > /tmp/lov_failed_step
              printf '%s' "$summary" > /tmp/lov_error_summary
              printf '%s' "$category" > /tmp/lov_error_category
              echo "::warning::Build step '$label' failed — category=$category"
              tail -n 120 "$tmp" | while IFS= read -r line; do "$0" log "$line" error; done
              "$0" log "Category: $category" error
              "$0" fail "$label" "$summary" "$tmp" "$category"
              "$0" log "$label failed with exit code $status" error
              exit "$status"
            fi
            "$0" log "$label complete" success
          fi
          BASH
          chmod +x /tmp/lov_report
          echo "/tmp" >> "$GITHUB_PATH"
      - name: Verify reporter prerequisites
        shell: bash
        run: |
          # Every log line, status update and artifact upload goes through
          # curl + python3. If either is missing the reporter fails silently and
          # the build shows "no logs" in the UI for 45 minutes, so check here and
          # say so out loud. Reported with a hand-built payload because
          # lov_report itself needs python3.
          missing=""
          command -v curl >/dev/null 2>&1 || missing="curl"
          command -v python3 >/dev/null 2>&1 || missing="${missing:+$missing and }python3"
          if [ -n "$missing" ]; then
            echo "::error::Build runner is missing $missing, which Corenna needs to stream build logs."
            if command -v curl >/dev/null 2>&1; then
              curl -sS -X POST -H "Content-Type: application/json" \
                --data "{\"build_id\":\"$LOVABLE_BUILD_ID\",\"token\":\"$REPORT_TOKEN\",\"status\":\"failed\",\"error_message\":\"Build runner is missing $missing\",\"failed_step\":\"Verify reporter prerequisites\",\"error_category\":\"missing_tool_error\"}" \
                "$REPORT_URL" >/dev/null 2>&1 || true
            fi
            exit 1
          fi
      - name: Report build started
        shell: bash
        run: lov_report status building
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Detect project layout
        shell: bash
        run: |
          python3 - <<'PYDETECT' > /tmp/lov_layout.env
          import json, os

          IGNORE = {"node_modules","dist","build","out","www",".next",".output",
                    "ios","android","vendor","Pods","coverage",".git","tmp"}

          def load(p):
              try:
                  with open(p, "r", errors="replace") as fh:
                      return json.load(fh)
              except Exception:
                  return {}

          cands = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in IGNORE and not d.startswith(".")]
              rel = "." if root == "." else os.path.relpath(root, ".")
              d = 0 if rel == "." else rel.count(os.sep) + 1
              if d > 3:
                  dirs[:] = []
                  continue
              if "package.json" not in files:
                  continue
              pkg = load(os.path.join(root, "package.json"))
              scripts = pkg.get("scripts") or {}
              deps = dict(pkg.get("dependencies") or {})
              deps.update(pkg.get("devDependencies") or {})
              has_build = bool(str(scripts.get("build", "")).strip())
              has_index = os.path.isfile(os.path.join(root, "index.html"))
              has_cap = ("@capacitor/core" in deps or "@capacitor/cli" in deps or
                         any(os.path.isfile(os.path.join(root, "capacitor.config." + e))
                             for e in ("json", "ts", "js")))
              score = (8 if has_build else 0) + (6 if has_index else 0) + \
                      (4 if has_cap else 0) + (3 if rel == "." else 0) - d
              cands.append((score, d, rel, has_build, has_index, pkg))

          cands.sort(key=lambda c: (-c[0], c[1], c[2]))
          buildable = [c for c in cands if c[3] or c[4]]
          chosen = buildable[0] if buildable else (cands[0] if cands else None)

          if chosen is None:
              print("APP_DIR=")
              print("LAYOUT_ERROR=no_package_json")
              raise SystemExit(0)

          _, _, app_dir, _, _, pkg = chosen
          scripts = pkg.get("scripts") or {}
          deps = dict(pkg.get("dependencies") or {})
          deps.update(pkg.get("devDependencies") or {})
          build_script = str(scripts.get("build", ""))

          locks = [("bun.lockb","bun"),("bun.lock","bun"),("pnpm-lock.yaml","pnpm"),
                   ("yarn.lock","yarn"),("package-lock.json","npm")]
          lockfile, manager = "", ""
          for name, mgr in locks:
              if os.path.isfile(os.path.join(app_dir, name)):
                  lockfile, manager = name, mgr
                  break
          if not manager:
              field = str(pkg.get("packageManager") or "").split("@")[0].strip().lower()
              manager = field if field in ("npm","pnpm","yarn","bun") else "npm"

          cmds = {
            "npm":  ("npm ci --no-audit --no-fund", "npm install --no-audit --no-fund --legacy-peer-deps"),
            "pnpm": ("pnpm install --frozen-lockfile", "pnpm install --no-frozen-lockfile"),
            "yarn": ("yarn install --frozen-lockfile", "yarn install"),
            "bun":  ("bun install --frozen-lockfile", "bun install"),
          }
          frozen, loose = cmds[manager]

          if "next" in deps or "next build" in build_script:
              framework, web_dir = "next", "out"
          elif "astro" in deps or "astro build" in build_script:
              framework, web_dir = "astro", "dist"
          elif "@angular/core" in deps or "ng build" in build_script:
              framework, web_dir = "angular", "dist"
          elif "vite" in deps or "vite build" in build_script:
              framework, web_dir = "vite", "dist"
          elif "react-scripts" in deps or "react-scripts build" in build_script:
              framework, web_dir = "cra", "build"
          else:
              framework, web_dir = "unknown", "dist"

          runner = {"npm": "npm run", "pnpm": "pnpm run", "yarn": "yarn", "bun": "bun run"}[manager]

          print("APP_DIR=" + app_dir)
          print("PKG_MANAGER=" + manager)
          print("LOCKFILE=" + lockfile)
          print("INSTALL_CMD=" + (frozen if lockfile else loose))
          print("INSTALL_FALLBACK=" + loose)
          print("BUILD_CMD=" + runner + " build")
          print("WEB_FRAMEWORK=" + framework)
          print("WEB_DIR=" + web_dir)
          print("HAS_BUILD_SCRIPT=" + ("1" if str(scripts.get("build","")).strip() else "0"))
          PYDETECT
          cat /tmp/lov_layout.env >> "$GITHUB_ENV"
          # Values contain spaces, so read them field-by-field instead of
          # sourcing the file (which GITHUB_ENV format doesn't quote).
          get() { grep -m1 "^$1=" /tmp/lov_layout.env | cut -d= -f2- || true; }
          APP_DIR="$(get APP_DIR)"
          PKG_MANAGER="$(get PKG_MANAGER)"
          LOCKFILE="$(get LOCKFILE)"
          WEB_FRAMEWORK="$(get WEB_FRAMEWORK)"
          WEB_DIR="$(get WEB_DIR)"
          if [ -z "$APP_DIR" ]; then
            lov_report fail "Detect project layout" "No package.json found within the first three folder levels of this repo. Corenna builds the web app first, so it needs a Node project (package.json with a \"build\" script) in the repo." "" "project_structure_error"
            exit 1
          fi
          where="repo root"
          [ "$APP_DIR" != "." ] && where="./$APP_DIR"
          lock_note=""
          [ -n "$LOCKFILE" ] && lock_note=" ($LOCKFILE)"
          lov_report log "Project layout: app in $where · $PKG_MANAGER$lock_note · $WEB_FRAMEWORK → $WEB_DIR/" success
      - name: Install package manager
        if: env.PKG_MANAGER != 'npm'
        shell: bash
        run: |
          case "$PKG_MANAGER" in
            bun)
              curl -fsSL https://bun.sh/install | bash
              echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
              export PATH="$HOME/.bun/bin:$PATH"
              sudo ln -sf "$HOME/.bun/bin/bun" /usr/local/bin/bun || true
              sudo ln -sf "$HOME/.bun/bin/bunx" /usr/local/bin/bunx || true
              ;;
            pnpm)
              npm install -g pnpm
              ;;
            yarn)
              if command -v corepack >/dev/null 2>&1; then
                corepack enable
                corepack prepare yarn@stable --activate
              else
                npm install -g yarn
              fi
              ;;
          esac
          # Check both shells: install/build steps run through `bash -lc`, whose
          # PATH is rebuilt by /etc/profile and may not include $HOME/.bun/bin.
          if ! command -v "$PKG_MANAGER" >/dev/null 2>&1 || ! bash -lc "command -v $PKG_MANAGER" >/dev/null 2>&1; then
            lov_report fail "Install package manager" "Could not make $PKG_MANAGER available on the build runner, so dependencies cannot be installed. Re-run the build; if it keeps failing, commit a package-lock.json so the build uses npm instead." "" "missing_tool_error"
            exit 1
          fi
          lov_report log "Package manager ready: $PKG_MANAGER" success
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          cat > /tmp/lov_install.sh <<'BASH'
          set -u
          transient() {
            grep -qiE 'econnreset|econnrefused|etimedout|socket hang up|could not resolve host|tls handshake|network is unreachable|502 bad gateway|503 service unavailable|504 gateway|temporary failure in name resolution' "$1"
          }
          # A missing binary is NOT a lockfile problem. Blaming the lockfile
          # here is what hid the "bun/pnpm/yarn was never installed" bug: the
          # fallback re-ran the same missing command and the user was told to
          # regenerate a lockfile that was perfectly fine.
          missing_tool() {
            grep -qiE 'command not found|: not found|No such file or directory' "$1"
          }
          # Only these look like a strict-install/lockfile mismatch.
          lockfile_mismatch() {
            grep -qiE 'eusage|lock ?file|out of sync|--no-frozen-lockfile|frozen-lockfile|npm ci can only install|does not match' "$1"
          }
          run_install() {
            local cmd="$1" out="$2"
            echo "> $cmd"
            # Pipeline rather than process substitution: transient()/
            # missing_tool()/lockfile_mismatch() below grep "$out" immediately
            # after this returns, and with `> >(tee …)` that file can still be
            # empty — which made real network blips look deterministic and skip
            # the retry.
            bash -lc "$cmd" 2>&1 | tee "$out"
            return ${PIPESTATUS[0]}
          }
          attempt=1
          out="$(mktemp)"
          while [ "$attempt" -le 3 ]; do
            if run_install "$INSTALL_CMD" "$out"; then break; fi
            if transient "$out"; then
              echo "::warning::Install failed with a transient network error (attempt $attempt/3); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
              continue
            fi
            if missing_tool "$out"; then
              echo "::error::$INSTALL_CMD failed because a required command is not available on the runner (see output above). This is a runner/tooling problem, not a lockfile problem."
              exit 1
            fi
            if lockfile_mismatch "$out"; then
              echo "::warning::$INSTALL_CMD failed (lockfile out of sync with package.json); retrying with $INSTALL_FALLBACK"
            else
              echo "::warning::$INSTALL_CMD failed; retrying once with $INSTALL_FALLBACK"
            fi
            if ! bash -lc "$INSTALL_FALLBACK"; then exit 1; fi
            break
          done
          if [ "$attempt" -gt 3 ]; then
            echo "::error::Install failed after 3 attempts due to repeated network errors"
            exit 1
          fi
          if [ ! -d node_modules ]; then
            echo "::error::node_modules missing after install in $APP_DIR"
            exit 1
          fi
          BASH
          lov_report run "Install dependencies" bash /tmp/lov_install.sh
      - name: Preflight web build
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ "${HAS_BUILD_SCRIPT:-0}" != "1" ]; then
            lov_report fail "Preflight web build" 'package.json in '"$APP_DIR"' has no "build" script — Corenna needs an npm/pnpm/yarn/bun "build" script that outputs static files (Vite: "build": "vite build"). Add one and re-run.' "" "project_structure_error"
            exit 1
          fi
          if [ "$WEB_FRAMEWORK" = "vite" ] && [ ! -f index.html ]; then
            found="$(find . -maxdepth 2 -name index.html -not -path './node_modules/*' 2>/dev/null | head -1)"
            if [ -n "$found" ]; then
              lov_report fail "Preflight web build" "Vite needs index.html next to package.json (in $APP_DIR). Found one at $found instead — move it, or set 'root' in vite.config." "" "project_structure_error"
            else
              lov_report fail "Preflight web build" "No index.html found in $APP_DIR — Vite uses it as the build entry point. Add index.html next to package.json." "" "project_structure_error"
            fi
            exit 1
          fi
          lov_report log "Preflight passed for $APP_DIR ($WEB_FRAMEWORK)" success
      - name: Build web app
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: lov_report run "Build web app" bash -lc "$BUILD_CMD"
      - name: Verify web output
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ -f "$WEB_DIR/index.html" ]; then
            lov_report log "Web build output verified at $APP_DIR/$WEB_DIR" success
            exit 0
          fi
          # The declared framework default can be wrong (custom outDir). Find the
          # real output directory rather than shipping an empty native shell.
          for d in dist build out www public/build .output/public dist/spa; do
            if [ -f "$d/index.html" ]; then
              echo "WEB_DIR=$d" >> "$GITHUB_ENV"
              lov_report log "Web output found at $APP_DIR/$d (expected $WEB_DIR)" success
              exit 0
            fi
          done
          found="$(find . -maxdepth 3 -name index.html -not -path './node_modules/*' -not -path './index.html' 2>/dev/null | head -1)"
          lov_report fail "Verify web output" "The build finished but produced no index.html in $WEB_DIR/${found:+ (closest match: $found)}. Point your build at a static output folder (Vite: build.outDir) so Corenna can wrap it into the app." "" "web_build_error"
          exit 1
      - name: Prepare Capacitor Android project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          cat > /tmp/lov_prepare_android.sh <<'BASH'
            set -e

            # Keep Capacitor packages on the same major as the app. Forcing
            # Capacitor 6 here caused recurring ERESOLVE/platform resolution
            # failures for repos already on another Capacitor major.
            CAP_CORE_VERSION="$(node -p 'try{require("./node_modules/@capacitor/core/package.json").version}catch(e){""}')"
            if [ -n "$CAP_CORE_VERSION" ]; then
              CAP_MAJOR="$(printf '%s' "$CAP_CORE_VERSION" | cut -d. -f1)"
            else
              CAP_MAJOR="$(node -p 'try{const p=require("./package.json");const s=(p.dependencies&&p.dependencies["@capacitor/core"])||(p.devDependencies&&p.devDependencies["@capacitor/core"])||"";const m=String(s).match(/[0-9]+/);m?m[0]:""}catch(e){""}')"
            fi
            CAP_MAJOR="$(printf '%s' "${CAP_MAJOR:-6}" | grep -E '^[0-9]+$' || printf '6')"

            CAP_PACKAGES=()
            if [ -z "$CAP_CORE_VERSION" ]; then
              CAP_PACKAGES+=("@capacitor/core@^$CAP_MAJOR")
            fi
            CAP_PACKAGES+=("@capacitor/cli@^$CAP_MAJOR" "@capacitor/android@^$CAP_MAJOR")
            npm install --no-save --legacy-peer-deps "${CAP_PACKAGES[@]}"

            # webDir must point at the folder the web build actually produced,
            # otherwise 'cap sync' copies an empty shell and the installed app
            # opens to a white screen. WEB_DIR is resolved by "Verify web output".
            CFG=""
            for f in capacitor.config.json capacitor.config.ts capacitor.config.js; do
              [ -f "$f" ] && CFG="$f" && break
            done
            if [ -z "$CFG" ]; then
              npx --no-install cap init "$APP_NAME" "$BUNDLE_ID" --web-dir="$WEB_DIR"
            else
              CFG_WEB_DIR="$(grep -oE '"?webDir"?[[:space:]]*:[[:space:]]*["'"'"'][^"'"'"']+' "$CFG" | head -1 | sed -E 's/.*["'"'"']//')"
              if [ -n "$CFG_WEB_DIR" ] && [ ! -f "$CFG_WEB_DIR/index.html" ]; then
                if [ "$CFG" = "capacitor.config.json" ]; then
                  node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.webDir=process.env.WEB_DIR;fs.writeFileSync(p,JSON.stringify(c,null,2));"
                  echo "::warning::capacitor.config.json webDir '$CFG_WEB_DIR' does not exist; using '$WEB_DIR'"
                else
                  echo "Capacitor webDir mismatch: $CFG sets webDir to '$CFG_WEB_DIR', but the build output is in '$WEB_DIR'. Update $CFG so webDir points at '$WEB_DIR' — otherwise the installed app would open to a blank screen." >&2
                  exit 1
                fi
              fi
            fi
            if [ ! -d android ]; then
              npx --no-install cap add android
            fi
            if [ -f resources/icon.png ]; then
              npm install --no-save --legacy-peer-deps @capacitor/assets@^3
              npx --no-install capacitor-assets generate --android || true
            fi
            npx --no-install cap sync android
          BASH
          lov_report run "Prepare Capacitor Android project" bash /tmp/lov_prepare_android.sh

      - name: Configure AdMob (native Android)
        if: ${{ fromJSON(inputs.config).admob_enabled && fromJSON(inputs.config).admob_android_app_id != '' }}
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          ADMOB_APP_ID: ${{ fromJSON(inputs.config).admob_android_app_id }}
          ADMOB_INTERSTITIAL_ID: ${{ fromJSON(inputs.config).admob_interstitial_unit_id }}
          ADMOB_SANDBOX: ${{ fromJSON(inputs.config).skip_artifact_upload }}
        run: |
          set -euo pipefail
          mkdir -p .corenna android/app/src/main
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # 1) Inject the App ID into <application> as meta-data. Idempotent.
          if grep -q 'com.google.android.gms.ads.APPLICATION_ID' "$MANIFEST"; then
            sed -i 's|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="[^"]*" />|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'"$ADMOB_APP_ID"'" />|' "$MANIFEST"
          else
            python3 - "$MANIFEST" "$ADMOB_APP_ID" <<'PY'
          import sys, re
          path, app_id = sys.argv[1], sys.argv[2]
          xml = open(path, encoding="utf-8").read()
          m = re.search(r"<application[^>]*>", xml)
          if not m:
              raise SystemExit("No <application> tag in AndroidManifest.xml")
          meta = '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>\n    ' % app_id
          xml = xml[:m.end()] + meta + xml[m.end():]
          open(path, "w", encoding="utf-8").write(xml)
          PY
          fi
          echo "::group::AdMob manifest after injection"
          sed -n '1,60p' "$MANIFEST"
          echo "::endgroup::"

          # 2) Install the Capacitor AdMob bridge (same Capacitor major as the app).
          CAP_MAJOR="${ADMOB_CAP_MAJOR:-6}"
          if [ -n "$CAP_MAJOR" ]; then
            npm install --no-save --legacy-peer-deps "@capacitor-community/admob@^6" || true
          fi

          # 3) Runtime config for the web helper. Real IDs only in real
          # (non-sandbox) builds; development/test ads everywhere else.
          if [ "$ADMOB_SANDBOX" = "true" ]; then
            printf '{"appId":"%s","interstitialAdUnitId":"","testAds":true,"enabled":false}' "$ADMOB_APP_ID" > .corenna/admob-config.json
          else
            printf '{"appId":"%s","interstitialAdUnitId":"%s","testAds":false,"enabled":true}' "$ADMOB_APP_ID" "$ADMOB_INTERSTITIAL_ID" > .corenna/admob-config.json
          fi
          lov_report log "AdMob configured (appId $ADMOB_APP_ID, test ads: $([ \"$ADMOB_SANDBOX\" = true ] && echo yes || echo no))" success

      - name: Configure Android signing
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            mkdir -p android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            # Capture the upload-certificate fingerprints. Output is captured,
            # never printed: keytool -list -v echoes certificate details and we
            # must not leak the store password or the raw dump into build logs.
            ks_out="$(cd android/app && keytool -list -v -keystore release.keystore -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null)" || ks_out=""
            ks_sha1="$(printf '%s\n' "$ks_out" | grep -E '^[[:space:]]*SHA1:' | head -n 1 | sed -E 's/^[[:space:]]*SHA1:[[:space:]]*//' | tr -d '\r' | tr '[:lower:]' '[:upper:]')"
            ks_sha256="$(printf '%s\n' "$ks_out" | grep -E '^[[:space:]]*SHA256:' | head -n 1 | sed -E 's/^[[:space:]]*SHA256:[[:space:]]*//' | tr -d '\r' | tr '[:lower:]' '[:upper:]')"
            ks_out=""
            unset ks_out
            if [ -n "$ks_sha1" ] && [ -n "$ks_sha256" ]; then
              lov_report fingerprint "$ks_sha1" "$ks_sha256"
              lov_report log "Upload certificate fingerprints recorded" success
            fi
            cat > android/keystore.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF
            # Idempotent: skip appending the lovableRelease signing block if a
            # previous run on the same checkout (cached workspace, re-run, etc.)
            # already added it — Gradle errors on duplicate signingConfigs.
            if ! grep -q "lovableRelease" android/app/build.gradle; then
              cat >> android/app/build.gradle <<'EOF'

          def lovableKeystoreProperties = new Properties()
          def lovableKeystorePropertiesFile = rootProject.file('keystore.properties')
          if (lovableKeystorePropertiesFile.exists()) {
              lovableKeystoreProperties.load(new FileInputStream(lovableKeystorePropertiesFile))
          }

          android {
              signingConfigs {
                  lovableRelease {
                      storeFile file(lovableKeystoreProperties['storeFile'])
                      storePassword lovableKeystoreProperties['storePassword']
                      keyAlias lovableKeystoreProperties['keyAlias']
                      keyPassword lovableKeystoreProperties['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.lovableRelease
                  }
              }
          }
          EOF
            fi
            if [ "${{ env.BUILD_TYPE }}" = "aab" ]; then
              echo "ANDROID_BUILD_TASK=:app:bundleRelease" >> "$GITHUB_ENV"
            else
              echo "ANDROID_BUILD_TASK=:app:assembleRelease" >> "$GITHUB_ENV"
            fi
            lov_report log "Android signing configured (target: ${{ env.BUILD_TYPE }})" success
          else
            lov_report fail "Configure Android signing" "Android signing secrets are incomplete; refusing to produce an unsigned debug artifact" "" "signing_error"
            exit 1
          fi
      - name: Build Android artifact
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: lov_report run "Gradle build" bash -lc 'chmod +x ./gradlew && ./gradlew "$ANDROID_BUILD_TASK" --no-daemon -Pversion="$APP_VERSION" -PversionCode="$BUILD_NUMBER"'
      - name: Report Android artifact metadata
        if: success()
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          # Product flavors nest outputs one level deeper
          # (outputs/apk/<flavor>/<buildType>/), so glob both shapes rather than
          # only the flavourless release/ path.
          shopt -s nullglob
          files=(android/app/build/outputs/apk/*/*.apk \
                 android/app/build/outputs/apk/*/*/*.apk \
                 android/app/build/outputs/bundle/*/*.aab \
                 android/app/build/outputs/bundle/*/*/*.aab)
          if [ ${#files[@]} -eq 0 ]; then
            lov_report fail "Report Android artifact metadata" "Gradle reported success but no .apk/.aab was found under android/app/build/outputs. Check for a custom output directory or a product flavor in android/app/build.gradle." "" "gradle_error"
            exit 1
          fi
          lov_report log "Found ${#files[@]} Android artifact(s)" success
          lov_report artifacts \
            'android/app/build/outputs/apk/*/*.apk' \
            'android/app/build/outputs/apk/*/*/*.apk' \
            'android/app/build/outputs/bundle/*/*.aab' \
            'android/app/build/outputs/bundle/*/*/*.aab'
      - name: Upload Android artifact
        if: ${{ env.SKIP_ARTIFACT_UPLOAD != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ env.BUILD_TYPE }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/*/*.apk
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/*/*/*.apk
            ${{ env.APP_DIR }}/android/app/build/outputs/bundle/*/*.aab
            ${{ env.APP_DIR }}/android/app/build/outputs/bundle/*/*/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Report artifact
        shell: bash
        run: |
          if [ "${{ env.SKIP_ARTIFACT_UPLOAD }}" = "true" ]; then
            lov_report log "Sandbox build: artifact upload skipped" success
          else
            lov_report log "Android ${{ env.BUILD_TYPE }} artifact uploaded (#${{ env.BUILD_NUMBER }})" success
          fi

      - name: Report final status
        if: always()
        shell: bash
        run: |
          failed_step=""
          error_summary=""
          error_category=""
          if [ -f /tmp/lov_failed_step ]; then failed_step="$(cat /tmp/lov_failed_step)"; fi
          if [ -f /tmp/lov_error_summary ]; then error_summary="$(cat /tmp/lov_error_summary)"; fi
          if [ -f /tmp/lov_error_category ]; then error_category="$(cat /tmp/lov_error_category)"; fi
          if [ "${{ job.status }}" = "success" ]; then
            lov_report final success "" "" "" ""
          elif [ "${{ job.status }}" = "cancelled" ]; then
            lov_report final cancelled "Workflow cancelled" "$failed_step" "$error_summary" "$error_category"
          else
            msg="Workflow job failed (see GitHub Actions logs)"
            [ -n "$error_summary" ] && msg="$error_summary"
            [ -z "$error_category" ] && error_category="unknown"
            lov_report final failed "$msg" "$failed_step" "$error_summary" "$error_category"
          fi
