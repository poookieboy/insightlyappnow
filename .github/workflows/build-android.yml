name: Build Insightly Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor web assets
        run: |
          rm -rf dist/client
          mkdir -p dist/client

          echo "Searching for index.html..."

          if [ -f "dist/index.html" ]; then
            echo "Found: dist/index.html"
            cp -R dist/* dist/client/

          elif [ -f ".output/public/index.html" ]; then
            echo "Found: .output/public/index.html"
            cp -R .output/public/* dist/client/

          else
            echo "ERROR: Could not find index.html"
            echo "Searching entire project..."
            find . -type f -name "index.html" \
              -not -path "./node_modules/*" \
              -not -path "./android/*" \
              -print
            exit 1
          fi

          echo "========================================"
          echo "CAPACITOR WEB ASSETS"
          echo "========================================"

          find dist/client -maxdepth 3 -type f | sort

          echo "========================================"
          echo "INDEX CHECK"
          echo "========================================"

          test -f dist/client/index.html

      - name: Point Capacitor at the built web output
        run: |
          node -e "
            const fs = require('fs');
            const p = 'capacitor.config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.webDir = 'dist/client';
            delete c.bundledWebRuntime;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: insightly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: insightly-android-project
          path: android
          if-no-files-found: error
